name: Crawler Setup Smoke
on:
  push:
    branches:
      - isolation/crawler-service-20261029
  pull_request:
    paths:
      - crawler_app.py
      - templates/crawler/**
      - blueprints/automation_hub/__init__.py
      - tests/test_crawler_*.py
      - .github/workflows/crawler-setup-smoke.yml
jobs:
  setup-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install production dependencies
        run: pip install -r requirements.txt
      - name: Compile crawler entrypoint
        run: python -m py_compile crawler_app.py
      - name: Test database-free login and ORDER isolation
        run: python -m unittest discover -s tests -p "test_crawler_*.py" -v
