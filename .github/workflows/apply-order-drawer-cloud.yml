name: Apply ORDER drawer cloud compatibility

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Install ORDER drawer cloud compatibility') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Patch ORDER drawer cloud reads
        run: python scripts/patch_order_drawer_full_cloud.py
      - name: Compile changed modules
        run: |
          python -m py_compile order_tracking/__init__.py
          python -m py_compile order_tracking/data_provider.py
          python -m py_compile services/order_tracking_render_provider.py
          python -m py_compile services/order_cloud_service.py
          python -m py_compile services/order_cloud_snapshot_service.py
          python -m py_compile scripts/order_cloud_sync_real_order.py
      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git add order_tracking/__init__.py order_tracking/data_provider.py services/order_tracking_render_provider.py services/order_cloud_service.py services/order_cloud_snapshot_service.py scripts/order_cloud_sync_real_order.py
          git commit -m "Install ORDER drawer cloud compatibility"
          git push
