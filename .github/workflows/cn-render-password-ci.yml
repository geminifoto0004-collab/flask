name: China links Render password checks
on:
  pull_request:
    paths:
      - "services/order_share_cn_access.py"
      - "templates/order_share_telegram/**"
      - "tests/test_order_share_cn_env.py"
      - ".github/workflows/cn-render-password-ci.yml"
  push:
    branches:
      - "fix/cn-render-password-and-qr-20261109"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "Flask==2.3.3" "Werkzeug==2.3.7" "qrcode>=7.4,<9"
      - run: python -m unittest discover -s tests -p test_order_share_cn_env.py -v
