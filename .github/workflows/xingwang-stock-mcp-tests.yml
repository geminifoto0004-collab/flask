name: XINGWANG STOCK MCP safety tests
on:
  push:
    branches:
      - feature/xingwang-stock-mcp-v1
  pull_request:
    branches:
      - xingwang-telegram-miniapp-v1
    paths:
      - 'xingwang_miniapp/**'
      - '.github/workflows/xingwang-stock-mcp-tests.yml'
permissions:
  contents: read
jobs:
  mcp-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MCP server dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r xingwang_miniapp/requirements.txt pytest httpx
      - name: Verify Auth0 tenant public OIDC/JWKS discovery
        run: |
          python - <<'PY'
          import json
          from urllib.request import urlopen
          issuer = "https://dev-a7e4fupofgtxlva0.us.auth0.com/"
          def read(url):
              with urlopen(url, timeout=15) as response:
                  assert response.status == 200
                  return json.load(response)
          metadata = read(issuer + ".well-known/openid-configuration")
          assert metadata.get("issuer") == issuer, "Auth0 issuer mismatch"
          assert metadata.get("jwks_uri") == issuer + ".well-known/jwks.json", "Unexpected Auth0 signing key endpoint"
          assert "code" in metadata.get("response_types_supported", []), "No authorization-code support advertised"
          keys = read(metadata["jwks_uri"]).get("keys", [])
          assert any(k.get("kty") == "RSA" and k.get("use") in (None, "sig") for k in keys), "No public RSA signing key"
          print("Auth0 discovery and public signing key verified; no credentials accessed")
          PY
      - name: Live Render MCP anonymous-access security check
        run: |
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          base = "https://xingwang-stock-miniapp.onrender.com"
          issuer = "https://dev-a7e4fupofgtxlva0.us.auth0.com/"

          def request(path, method="GET", body=None, headers=None):
              req = Request(base + path, data=body, headers=headers or {}, method=method)
              try:
                  with urlopen(req, timeout=30) as resp:
                      return resp.status, dict(resp.headers), resp.read(8192)
              except HTTPError as exc:
                  return exc.code, dict(exc.headers), exc.read(8192)

          status, _, response = request("/healthz")
          assert status == 200, f"Telegram /healthz unexpected HTTP {status}"
          health = json.loads(response)
          assert health.get("service") == "xingwang-miniapp", "Unexpected relay service"

          status, _, response = request("/.well-known/oauth-protected-resource/mcp")
          assert status == 200, f"Missing RFC 9728 resource metadata: {status}"
          meta = json.loads(response)
          assert meta.get("resource") == base + "/mcp", "MCP resource URL mismatch"
          assert issuer in meta.get("authorization_servers", []), "Untrusted/missing Auth0 issuer"

          body = json.dumps({
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/call",
              "params": {"name": "search_stock", "arguments": {"product_code": "1314"}}
          }).encode()
          status, headers, _ = request(
              "/mcp", "POST", body,
              {"Content-Type": "application/json", "Accept": "application/json, text/event-stream"}
          )
          assert status == 401, f"Anonymous MCP access was not denied with 401: {status}"
          assert "www-authenticate" in {k.lower() for k in headers}, "Missing OAuth challenge"
          print("Live MCP discovered Auth0 and rejected anonymous requests (401); no stock data accessed")
          PY
      - name: Python syntax
        run: python -m compileall -q xingwang_miniapp
      - name: OAuth and stock schema tests
        run: python -m pytest -q xingwang_miniapp/tests/test_stock_mcp.py
      - name: Verify Telegram relay retained
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("xingwang_miniapp/miniapp_server.py").read_text()
          for route in ('@app.post("/api/query")', '@app.websocket("/bridge")'):
              assert route in source, route
          assert '"stock_mcp"' in source
          assert 'XW_STOCK_MCP_ENABLED' in source
          print("Telegram routes preserved, MCP feature gated")
          PY
