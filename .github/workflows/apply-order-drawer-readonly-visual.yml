name: Apply Render drawer readonly visual alignment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Install Render drawer readonly visual alignment') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Patch drawer visual alignment
        run: python scripts/patch_order_drawer_readonly_visual.py
      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git add order_tracking/static/js/WORKSPACE_drawer.js
          git commit -m "Install Render drawer readonly visual alignment"
          git push
