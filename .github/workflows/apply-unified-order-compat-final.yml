name: Apply final unified ORDER compatibility

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Install final unified ORDER compatibility') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply and validate compatibility patch
        run: python scripts/patch_unified_order_compat_final.py
      - name: Compile unified ORDER modules
        run: |
          python -m py_compile order_tracking/db_compat.py
          python -m py_compile order_tracking/db_backend.py
          python -m py_compile order_tracking/runtime_mode.py
          python -m py_compile order_tracking/cloud_mode.py
          python -m py_compile order_tracking/data_provider.py
          python -m py_compile services/order_tidb_connection.py
          python -m py_compile services/order_full_mirror_service.py
          python -m py_compile scripts/order_full_mirror_sync.py
          python -m py_compile blueprints/order_tracking_cloud_auth_bp.py
          python -m py_compile services/order_tracking_cloud_auth.py
      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git add order_tracking/db_compat.py
          git commit -m "Install final unified ORDER compatibility"
          git push
