name: Patch ORDER notification mirror

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Skip ORDER notification rows in TiDB mirror') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply notification mirror patch
        run: python scripts/patch_skip_notifications_full_mirror.py
      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git add scripts/order_full_mirror_sync.py
          git commit -m "Skip ORDER notification rows in TiDB mirror"
          git push
