<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>XINGWANG · QR 布樣掃描</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#192a39;background:#f3f5f9}
*{box-sizing:border-box}body{margin:0}button,input{font:inherit}
main{max-width:780px;margin:auto;padding:18px 14px 65px}
header{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}
.header-actions{display:flex;align-items:center;gap:5px;flex:none}
.admin-icon{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;flex:none;border:1px solid #d1dfec;border-radius:10px;background:#edf3fa;color:#21527e;text-decoration:none}
.admin-icon:hover{background:#ddebf9;color:#1265bb}
.admin-icon:focus-visible{outline:2px solid #1265bb;outline-offset:2px}
.admin-icon svg{width:22px;height:22px;display:block}
h1{font-size:21px;margin:0}h2{font-size:16px;margin:0 0 10px}
small,.muted{color:#64748b;font-size:12px;line-height:1.5}
.panel{background:white;border:1px solid #dce4ee;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 6px #0b25400b}
input{min-width:0;border:1px solid #c9d4e0;background:#fff;color:#172b40;border-radius:10px;padding:12px;font-size:16px}
button{border:0;background:#1265bb;color:#fff;border-radius:10px;padding:12px 15px;font-weight:700;cursor:pointer}
button.secondary{background:#eef3f8;color:#213a53}button:disabled{opacity:.55;cursor:wait}
button.ghost{background:transparent;color:#24517a;padding:8px}
.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.fill{flex:1}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modes button{background:#edf2f8;color:#2d4864}
.modes button.active{background:#145ba4;color:#fff}
#reader{max-width:460px;margin:10px auto;overflow:hidden;border-radius:10px}
#reader video{max-width:100%}#reader button{font-size:12px}
#message{font-size:13px;margin-top:9px;line-height:1.65;white-space:pre-wrap}
#message.error{color:#ad2a2a}#message.good{color:#147b4e}
#freshnessPanel{margin:12px 0 9px;background:#f4f7fb;border-color:#dce4ee;color:#465c73}
#freshnessPanel.stale{background:#fff8e9;border-color:#efce8c;color:#865a13}
#freshnessPanel.fresh{background:#f1f9f4;border-color:#b5ddc0;color:#17673b}
.freshnessAdmin{display:inline-flex;padding:10px 11px;border-radius:10px;background:#fff;color:#145ba4;border:1px solid #cbd7e4;text-decoration:none;font-size:12px;font-weight:700}
#freshnessCheckBtn{font-size:12px;padding:10px 12px}
.freshness-head{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
#freshnessText{flex:1;min-width:0}
#freshnessDismissBtn{flex:0 0 30px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:inherit;opacity:.8;font-size:24px;font-weight:400;line-height:1;border-radius:8px;padding:0;margin:-6px -6px 0 0}
#freshnessDismissBtn:hover{background:#00000012;opacity:1}
#freshnessDismissBtn:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.stock-stat-grid{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.stock-stat{flex:1 1 calc(50% - 8px);min-width:118px;background:#f1f6fb;border-radius:12px;padding:12px}
.stock-stat small{display:block;color:#627b8e;font-size:11px;margin-bottom:4px}
.stock-stat strong{font-size:20px;font-variant-numeric:tabular-nums;color:#213a53}
.stock-filter-row{display:flex;align-items:center;gap:8px;margin:13px 0 10px}
.stock-filter-row input{flex:1;min-width:0;width:100%;padding:10px;font-size:16px}
.stock-filter-row .muted{white-space:nowrap}
.stock-tablewrap{overflow:auto;max-height:65vh;min-height:90px;border:1px solid #ecf0f4;border-radius:12px}
.stock-tablewrap table{min-width:100%;width:100%;font-size:13px}
.stock-tablewrap th,.stock-tablewrap td{padding:11px 10px;white-space:nowrap}
.stock-tablewrap th{position:sticky;top:0;background:#f7fafd;cursor:pointer;user-select:none}
.stock-tablewrap th:focus-visible{outline:2px solid #1265bb;outline-offset:-2px}
.stock-tablewrap td{font-variant-numeric:tabular-nums}
.stock-note{margin:10px 0 0}
#login{max-width:420px;margin:30px auto}#login input{width:100%;margin:12px 0}
#login button{width:100%}.info{background:#f5f8fc;border-radius:10px;padding:11px;color:#52677d;font-size:12px;line-height:1.6}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:12px 7px;border-bottom:1px solid #ecf0f4;text-align:left}th{font-size:12px;color:#667b8a}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.stockline{display:flex;align-items:center;gap:7px}input[type="checkbox"]{width:23px;height:23px;accent-color:#c8493a;cursor:pointer}
.tag{display:inline-block;background:#edf2f8;border-radius:8px;padding:5px 9px;font-size:12px}
.metrics{display:flex;flex-wrap:wrap;gap:8px}.metrics span{background:#f1f6fb;border-radius:10px;padding:9px;flex:1;white-space:nowrap}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.notice{background:#fff8e9;border:1px solid #f0d9a6;border-radius:10px;padding:10px;font-size:12px;color:#835a15}
.hidden{display:none!important}@media (max-width:420px){.panel{padding:12px}.row input{width:100%}button{padding:11px}}
</style>
</head>
<body><main>
<header><div><h1>XINGWANG SCANNER</h1><small>掃描布樣 · 查詢庫存 · 確認盤點</small></div><div class="header-actions"><a class="admin-icon hidden" id="adminLink" href="/scanner/admin" target="_blank" rel="noopener noreferrer" title="管理功能 · 開啟新分頁" aria-label="開啟庫存管理"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.3" fill="#fff"/><circle cx="16" cy="17" r="2.3" fill="#fff"/></svg></a><button id="logout" class="ghost hidden">登出</button></div></header>
<section id="login" class="panel hidden">
<h2>首次登入掃描器</h2>
<p class="muted">輸入公司登入碼，這台手機將保持登入 30 天。</p>
<input id="passcode" type="password" placeholder="公司登入碼" autocomplete="current-password">
<button id="loginBtn">登入</button><p id="loginMessage" class="muted"></p>
</section>
<div id="app" class="hidden">
<section class="panel">
<div class="modes"><button id="modeSample" class="active">布樣盤點</button><button id="modeStock">查詢庫存</button></div>
<div id="freshnessPanel" class="notice hidden" role="status" aria-live="polite">
<div class="freshness-head"><span id="freshnessText">庫存快照已超過 60 分鐘，請先更新。</span><button type="button" id="freshnessDismissBtn" class="freshness-close" aria-label="關閉庫存更新提醒" title="關閉提醒">×</button></div>
<div class="row" style="margin-top:8px;flex-wrap:wrap">
<a class="freshnessAdmin" href="/scanner/admin" target="_blank" rel="noopener noreferrer">前往更新庫存</a>
<button type="button" id="freshnessCheckBtn" class="secondary">重新檢查</button>
</div></div>

<p class="muted" id="modeHelp">掃描系列 QR，查看每個庫存編號，勾選「無樣」。</p>
<div id="reader"></div>
<div class="row"><button id="cameraStart" class="fill">開啟相機連續掃描</button><button id="cameraStop" class="secondary hidden">停止相機</button></div>
<p id="cameraHint" class="muted">第一次使用請允許相機權限；不必切換到手機原生相機。</p>
<div class="row"><input id="code" class="fill" placeholder="或手動輸入 12-225" autocomplete="off" enterkeyhint="search"><button id="queryBtn">查詢</button></div>
<div id="message" aria-live="polite">請掃描或輸入商品系列編號。</div>
</section>
<section id="stockResult" class="panel hidden" aria-label="庫存查詢結果">
<div class="bar"><div><h2 id="stockSeries"></h2><small id="stockAsOf" class="muted"></small></div><span id="stockSource" class="tag"></span></div>
<div class="stock-stat-grid" id="stockStats"></div>
<div class="stock-filter-row"><input id="stockFilter" type="search" placeholder="篩選目前全部庫存明細" autocomplete="off" aria-label="篩選庫存明細"><span class="muted" id="stockCount">0 / 0 筆</span></div>
<div class="stock-tablewrap"><table><thead><tr id="stockTableHead"></tr></thead><tbody id="stockTableBody"></tbody></table></div>
<p class="muted stock-note" id="stockNote">與 Telegram 庫存查詢同樣的統計、篩選和排序；待到貨單位為箱。</p>
<div class="row"><button id="stockNextBtn" class="fill secondary">查下一個商品</button></div>
</section>
<section id="result" class="panel hidden">
<div class="bar"><div><h2 id="series"></h2><small id="asof"></small></div><span id="source" class="tag"></span></div>
<div id="totals" class="metrics"></div>
<div style="overflow-x:auto;margin-top:10px"><table><thead><tr><th>商品編號</th><th class="num">匹數</th><th class="num">米數</th><th id="sampleHeading">無樣</th></tr></thead><tbody id="rows"></tbody></table></div>
<p id="emptyMsg" class="muted hidden">本次查詢沒有可列出的子商品。請確認 V33 查詢規則。</p>
<div id="sampleControls">
<div id="dbNotice" class="notice">尚未確認 TiDB 連線；不會寫入盤點資料。</div>
<p id="missingCount" class="muted"></p>
<div class="row"><button id="saveBtn" class="fill hidden">確認完成 · 保存 TiDB</button><button id="copyBtn" class="secondary">複製清單</button><button id="nextBtn" class="secondary">下一張</button></div>
</div>
</section>
<footer class="muted">XINGWANG · 布樣盤點與即時庫存</footer>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
let mode='sample', reader=null, running=false, locked=false, busy=false, current=null, missing=new Set(), saved=false;
const valid=s=>/^[A-Za-z0-9][A-Za-z0-9_.()/-]{1,39}$/.test(s);

let lastFreshness=null, checkingFreshness=null;
let freshnessDismissed=false;
function showFreshnessWarning(){
 const stale=lastFreshness?.fresh!==true;
 $('freshnessPanel').classList.toggle(
  'hidden',mode!=='sample'||!stale||freshnessDismissed
 );
}
function setFreshness(data){
 lastFreshness=data;
 const panel=$('freshnessPanel'),label=$('freshnessText');
 panel.classList.remove('fresh','stale');
 if(data?.fresh){
  // Normal use: never show a green banner. Reset X dismissal so a
  // later expired snapshot can generate a new reminder.
  freshnessDismissed=false;
 }else{
  panel.classList.add('stale');
  label.textContent=data?.has_synced
    ?'上次成功同步已超過 60 分鐘，建議先前往管理頁更新庫存，再進行布樣盤點。'
    :'尚無有效的庫存同步紀錄，請先前往管理頁同步庫存。';
 }
 showFreshnessWarning();
}
async function checkFreshness(){
 if(checkingFreshness)return checkingFreshness;
 checkingFreshness=(async()=>{
  try{
   const res=await fetch('/scanner/api/stock-freshness',{credentials:'same-origin',cache:'no-store'});
   const data=await res.json();
   if(!res.ok)throw new Error(data.detail||'TiDB 同步時間查詢失敗');
   setFreshness(data);
   return data;
  }catch(e){
   setFreshness(null);
   $('freshnessText').textContent='無法確認 TiDB 同步時間：'+e.message+'。請檢查資料庫後再盤點。';
   showFreshnessWarning();
   return null;
  }finally{checkingFreshness=null}
 })();
 return checkingFreshness;
}
$('freshnessCheckBtn').onclick=checkFreshness;
$('freshnessDismissBtn').onclick=()=>{
 freshnessDismissed=true;
 showFreshnessWarning();
};
window.addEventListener('focus',()=>{if(mode==='sample' && !$('app').classList.contains('hidden'))void checkFreshness()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden && mode==='sample' && !$('app').classList.contains('hidden'))void checkFreshness()});

function msg(s,type=''){const n=$('message');n.textContent=s;n.className=type}
function fmt(x){return x===null||x===undefined?'—':Number(x).toLocaleString('en-US',{maximumFractionDigits:2})}
async function post(path,body={}){
 const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body),cache:'no-store'});
 let data={};try{data=await r.json()}catch(_){}
 if(!r.ok)throw Object.assign(new Error(data.error||data.detail||'請求失敗 ('+r.status+')'),{status:r.status});
 return data
}
async function session(){
 try{
  const d=await (await fetch('/scanner/api/session',{credentials:'same-origin',cache:'no-store'})).json();
  $('login').classList.toggle('hidden',d.signed_in);
  $('app').classList.toggle('hidden',!d.signed_in);
  $('logout').classList.toggle('hidden',!d.signed_in);
  $('adminLink').classList.toggle('hidden',!d.signed_in);
  if(d.signed_in && mode==='sample')void checkFreshness();
  if(!d.configured)$('loginMessage').textContent='管理員尚未設定登入碼';
 }catch(e){$('login').classList.remove('hidden');$('loginMessage').textContent='連線失敗：'+e.message}
}
$('loginBtn').onclick=async()=>{let b=$('loginBtn');b.disabled=true;try{await post('/scanner/api/login',{passcode:$('passcode').value});$('passcode').value='';await session()}catch(e){$('loginMessage').textContent=e.message}finally{b.disabled=false}};
$('passcode').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});
$('logout').onclick=async()=>{await stopCamera();await post('/scanner/api/logout');await session()};
function setMode(m){
 if(mode!==m){
  current=null;missing.clear();locked=false;saved=false;
  $('result').classList.add('hidden');$('stockResult').classList.add('hidden');
  $('stockFilter').value='';$('code').value='';
 }
 mode=m;
 showFreshnessWarning();
 if(m==='sample')void checkFreshness();
 $('modeSample').classList.toggle('active',m==='sample');
 $('modeStock').classList.toggle('active',m==='stock');
 $('modeHelp').textContent=m==='sample'
  ?'掃描系列 QR，查看每個庫存編號，勾選「無樣」。'
  :'與 Telegram 相同的庫存查詢：合計、快速篩選、點欄名排序；不記錄布樣。';
 $('code').placeholder=m==='sample'?'或手動輸入 12-225':'輸入商品編號';
 $('result').classList.toggle('hidden',m!=='sample'||!current);
 $('stockResult').classList.toggle('hidden',m!=='stock'||!current);
 if(m==='stock' && current)renderStockResult();
 if(m==='sample' && current)renderRows();
}
$('modeSample').onclick=()=>setMode('sample');$('modeStock').onclick=()=>setMode('stock');
// Inventory presentation matches the Telegram STOCK tab; scanner login stays separate.
// We intentionally expose only allowlisted stock/incoming quantities, never customers,
// sale prices or Telegram-authenticated history.
const stockColumns=[
 ['code','商品編號'],
 ['stock_rolls','匹數'],
 ['stock_meters','米數'],
 ['incoming_boxes','待到貨(箱)']
];
let stockSort='',stockDesc=false;
function stockFormat(value){
 if(value===null||value===undefined||value==='')return '—';
 if(typeof value==='number')return value.toLocaleString('en-US',{maximumFractionDigits:3});
 return String(value);
}
function stockRows(){
 if(!current||!Array.isArray(current.variants))return [];
 // Incoming-only codes cannot be claimed as available stock.
 return current.variants.filter(v=>Number(v.stock_rows||0)>0);
}
function renderStockResult(){
 if(!current)return;
 const data=current, rows=stockRows(), stats=$('stockStats');
 stats.replaceChildren();
 for(const [name,value] of [
  ['商品種類',rows.length],
  ['庫存匹數',data.stock_rolls],
  ['庫存米數',data.stock_meters],
  ['待到貨(箱)',data.incoming_boxes]
 ]){
  const el=document.createElement('div');el.className='stock-stat';
  const label=document.createElement('small');label.textContent=name;
  const number=document.createElement('strong');number.textContent=stockFormat(value);
  el.append(label,number);stats.append(el);
 }
 $('stockSeries').textContent=data.product_code;
 $('stockAsOf').textContent='查詢時間：'+(data.as_of||'即時');
 $('stockSource').textContent=data.source==='company'?'公司電腦':data.source==='home'?'家裡電腦':'V33';
 const term=$('stockFilter').value.trim().toLocaleLowerCase();
 let list=rows.filter(r=>stockColumns.some(([field])=>String(r[field]??'').toLocaleLowerCase().includes(term)));
 if(stockSort){
  list=list.slice().sort((a,b)=>{
   const x=a[stockSort],y=b[stockSort];
   if(x==null&&y!=null)return 1;
   if(y==null&&x!=null)return -1;
   const cmp=(stockSort==='code')
      ?String(x??'').localeCompare(String(y??''),undefined,{numeric:true,sensitivity:'base'})
      :Number(x??0)-Number(y??0);
   return stockDesc?-cmp:cmp;
  });
 }
 $('stockCount').textContent=list.length+' / '+rows.length+' 筆';
 const head=$('stockTableHead');head.replaceChildren();
 for(const [field,title] of stockColumns){
  const th=document.createElement('th');
  th.textContent=title+(stockSort===field?(stockDesc?' ▼':' ▲'):'');
  if(field!=='code')th.className='num';
  th.tabIndex=0;th.setAttribute('role','button');
  th.setAttribute('aria-sort',stockSort===field?(stockDesc?'descending':'ascending'):'none');
  const apply=()=>{if(stockSort===field)stockDesc=!stockDesc;else{stockSort=field;stockDesc=false;}renderStockResult()};
  th.onclick=apply;
  th.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();apply()}};
  head.append(th);
 }
 const body=$('stockTableBody');body.replaceChildren();
 if(!list.length){
  const tr=document.createElement('tr'),td=document.createElement('td');
  td.colSpan=stockColumns.length;td.textContent='沒有符合條件的庫存資料';td.className='muted';
  tr.append(td);body.append(tr);
 }else{
  for(const entry of list){
   const tr=document.createElement('tr');
   for(const [field] of stockColumns){
    const td=document.createElement('td');
    td.textContent=stockFormat(entry[field]);
    if(field!=='code')td.className='num';
    tr.append(td);
   }
   body.append(tr);
  }
 }
}
$('stockFilter').addEventListener('input',renderStockResult);

function renderRows(){
 const body=$('rows');body.replaceChildren();
 if(!current)return;
 const arr=Array.isArray(current.variants)?current.variants:[];
 $('emptyMsg').classList.toggle('hidden',arr.length!==0);
 for(const x of arr){
  const tr=document.createElement('tr');
  for(const val of [x.code,fmt(x.stock_rolls),fmt(x.stock_meters)]){
   const td=document.createElement('td');td.textContent=val;if(val!==x.code)td.className='num';tr.append(td)
  }
  {
   const td=document.createElement('td');const cb=document.createElement('input');cb.type='checkbox';cb.checked=missing.has(x.code);cb.disabled=saved;cb.setAttribute('aria-label',x.code+' 無樣');
   cb.onchange=()=>{if(cb.checked)missing.add(x.code);else missing.delete(x.code);updateMissing()};td.append(cb);tr.append(td)
  }
  body.append(tr);
 }
 updateMissing();
}
function updateMissing(){$('missingCount').textContent='已標記無樣 '+missing.size+' 個；'+(saved?'本次結果已保存。':'其他編號在確認保存後會視為有樣。')}
function showResult(d){
 current=d;missing=new Set(Object.entries(d.previous_status||{}).filter(([k,v])=>v.missing).map(([k])=>k));saved=false;
 $('result').classList.toggle('hidden',mode!=='sample');
 $('stockResult').classList.toggle('hidden',mode!=='stock');
 $('saveBtn').classList.toggle('hidden',!d.db_connected);
 $('saveBtn').disabled=false;$('saveBtn').textContent='確認完成 · 保存 TiDB';$('saveBtn').classList.remove('secondary');
 stockSort='';stockDesc=false;$('stockFilter').value='';
 $('dbNotice').textContent=d.db_connected?'來自 TiDB 的上次完整庫存快照；可確認保存「有樣／無樣」狀態。':(d.db_error?'TiDB 連線失敗，不能保存盤點。':'尚無可用庫存快照，不能保存盤點。');
 $('series').textContent=d.product_code;
 $('source').textContent=d.source==='tidb'?'TiDB 快照':d.source==='company'?'公司電腦':d.source==='home'?'家裡電腦':'V33';
 $('asof').textContent='上次成功同步（UTC）：'+(d.as_of||'未提供');
 $('totals').replaceChildren();
 for(const [name,val] of [['庫存匹數',d.stock_rolls],['庫存米數',d.stock_meters],['商品明細',(d.variants||[]).length]]){
  const el=document.createElement('span');el.textContent=name+'：'+fmt(val);$('totals').append(el)
 }
 renderRows();
 if(mode==='stock')renderStockResult();
}
async function lookup(input){
 const code=(input||'').trim();if(!valid(code)){msg('QR 內容不是有效商品編號，請檢查後重試','error');return}
 if(busy)return;
 busy=true;locked=true;$('code').value=code;$('queryBtn').disabled=true;
 try{
  if(mode==='sample'){
   const fresh=await checkFreshness();
   if(!fresh?.fresh)throw Object.assign(new Error('庫存快照已超過 1 小時或無法確認。請先到管理頁更新庫存，再重新檢查。'),{status:409});
  }
  msg(mode==='sample'?'正在查詢 TiDB 布樣與庫存快照：'+code:'正在透過 V33 查即時庫存：'+code);
  const d=await post(mode==='sample'?'/scanner/api/sample':'/scanner/api/stock',{code});
  showResult(d);msg('查詢完成：'+code,'good');
 }catch(e){current=null;$('result').classList.add('hidden');$('stockResult').classList.add('hidden');locked=false;
  if(mode==='sample' && e.status===409)void checkFreshness();
  msg(e.status===401?'登入已過期，請重新登入。':e.message,'error');
  if(e.status===401)await session();
 }finally{busy=false;$('queryBtn').disabled=false}
}
$('queryBtn').onclick=()=>lookup($('code').value);
$('code').addEventListener('keydown',e=>{if(e.key==='Enter')lookup($('code').value)});
function onScan(raw){if(locked||busy)return;let code=String(raw||'').trim();if(valid(code))lookup(code);else msg('QR 不是商品編號，請掃描純編號 QR','error')}
async function startCamera(){
 if(running)return;
 if(!window.Html5Qrcode){msg('相機元件未載入，請檢查網路並重新整理。','error');return}
 try{
  reader=new Html5Qrcode('reader',{verbose:false});
  await reader.start({facingMode:'environment'},{fps:10,qrbox:{width:220,height:220}},onScan,()=>{});
  running=true;$('cameraStart').classList.add('hidden');$('cameraStop').classList.remove('hidden');msg('相機已開啟，請對準 QR Code。');
 }catch(e){reader=null;msg('無法開啟相機：請使用 HTTPS、允許相機權限。'+String(e),'error')}
}
async function stopCamera(){
 if(reader&&running){try{await reader.stop()}catch(_){}}
 if(reader){try{reader.clear()}catch(_){}}
 reader=null;running=false;$('cameraStart').classList.remove('hidden');$('cameraStop').classList.add('hidden')
}
$('cameraStart').onclick=startCamera;$('cameraStop').onclick=stopCamera;
function nextScan(){
 current=null;missing.clear();locked=false;saved=false;$('code').value='';$('result').classList.add('hidden');$('stockResult').classList.add('hidden');$('stockFilter').value='';msg(running?'可以繼續掃下一張，鏡頭不用關閉。':'請掃描下一張或手動輸入編號。'); 
}
$('nextBtn').onclick=nextScan;$('stockNextBtn').onclick=nextScan;
$('saveBtn').onclick=async()=>{
 if(!current?.db_connected||!current?.scan_id||saved)return;
 const b=$('saveBtn');b.disabled=true;
 try{const out=await post('/scanner/api/save',{scan_id:current.scan_id,missing:[...missing]});
 saved=true;renderRows();msg('已保存 TiDB：'+out.sku_count+' 個花色，無樣 '+out.missing_count+' 個。可以掃下一張。','good');
 b.textContent='已保存';b.classList.add('secondary');
 }catch(e){b.disabled=false;msg(e.message,'error');if(e.status===409)void checkFreshness()}
};
$('copyBtn').onclick=async()=>{
 if(!current)return;
 const lines=['布樣 '+current.product_code,'缺樣（'+(saved?'已保存 TiDB':'未保存')+'）：',...(missing.size?[...missing].sort():['無'])];
 try{await navigator.clipboard.writeText(lines.join('\n'));msg('清單已複製；'+(saved?'已保存 TiDB。':'尚未保存 TiDB。'),'good')}
 catch(_){msg(lines.join('\n'),'good')}
};
session();
</script></body></html>
