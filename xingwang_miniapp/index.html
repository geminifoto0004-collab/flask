<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/><title>XINGWANG · 业务查询</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color-scheme:light dark}
*{box-sizing:border-box}
body{width:100%;max-width:100%;margin:0;overflow-x:hidden;-webkit-text-size-adjust:100%;color:var(--tg-theme-text-color,#1a293b);background:var(--tg-theme-bg-color,#f6f7fa)}
button,input{font-family:inherit}button{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer;background:var(--tg-theme-button-color,#1686e9);color:var(--tg-theme-button-text-color,#fff)}button:disabled{opacity:.55}
header{padding:15px 13px 12px;background:var(--tg-theme-bg-color,#f6f7fa);border-bottom:1px solid #9cabbc55}
h1{font-size:18px;margin:0}.sub{font-size:11px;opacity:.7;line-height:1.5;margin:5px 0 12px}
.modes{display:flex;gap:7px}.modes button{flex:1;font-size:14px;color:inherit;background:var(--tg-theme-secondary-bg-color,#e9edf3)}.modes button.on{color:var(--tg-theme-button-text-color,#fff);background:var(--tg-theme-button-color,#1686e9)}
.search{margin-top:12px;display:flex;align-items:center;gap:7px;width:100%;min-width:0}.entry{flex:1;display:flex;align-items:center;min-width:0;max-width:100%;border:1px solid #9faebe;border-radius:11px;background:var(--tg-theme-secondary-bg-color,#fff)}
.entry input{width:100%;flex:1;min-width:0;border:0;outline:none;background:transparent;color:inherit;padding:12px;font-size:16px}
.clear{display:none;flex:0 0 auto;min-width:38px;background:transparent;color:var(--tg-theme-hint-color,#607185);font-size:21px;padding:5px 10px;border-radius:10px}.clear.visible{display:block}
.tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin-top:12px;padding-bottom:2px}.tabs button{white-space:nowrap;flex-shrink:0;color:inherit;background:var(--tg-theme-secondary-bg-color,#e9edf3);font-size:13px;padding:10px 12px}.tabs button.on{background:var(--tg-theme-button-color,#1686e9);color:var(--tg-theme-button-text-color,#fff)}
main{padding:13px 13px calc(32px + env(safe-area-inset-bottom,0px))}
#status{font-size:13px;line-height:1.6;margin:2px 0 11px;white-space:pre-wrap}
.stats{display:flex;gap:8px;overflow-x:auto;margin:10px 0}
.stat{flex:1;min-width:92px;padding:11px;border-radius:12px;background:var(--tg-theme-secondary-bg-color,#fff)}.stat small{display:block;font-size:11px;opacity:.7}.stat strong{font-size:19px;line-height:1.4;display:block}
.filterline{display:flex;gap:9px;align-items:center;margin:11px 0}.filterline input{flex:1;min-width:0;width:100%;border:1px solid #9faebe;border-radius:10px;background:var(--tg-theme-secondary-bg-color,#fff);padding:10px;font-size:16px;color:inherit}.count{font-size:12px;white-space:nowrap;opacity:.65}
.tablewrap{overflow:auto;min-height:100px;max-height:65vh;border-radius:12px;background:var(--tg-theme-secondary-bg-color,#fff)}
table{border-collapse:collapse;min-width:100%;font-size:13px}
th,td{padding:11px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid #9caab833}
th{position:sticky;top:0;background:var(--tg-theme-secondary-bg-color,#fff);font-size:12px;cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums}
.customer-short{border:0;background:transparent;color:inherit;text-align:left;font-size:13px;font-weight:400;display:block;max-width:fit-content;width:116px;padding:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:0;text-decoration:none}
.customer-short.expanded{max-width:min(70vw,340px);width:auto;white-space:normal;overflow-wrap:anywhere}
.customer-short:focus-visible{outline:2px solid var(--tg-theme-button-color,#1686e9);outline-offset:2px}

.empty{text-align:center;padding:30px 12px;opacity:.7}.hint{margin-top:11px;font-size:12px;line-height:1.6;opacity:.72}
.doc{border-radius:13px;background:var(--tg-theme-secondary-bg-color,#fff);margin:10px 0;overflow:hidden}
.doc summary{list-style:none;cursor:pointer;padding:14px;display:block}.doc summary::-webkit-details-marker{display:none}
.doc-head{display:flex;align-items:center;justify-content:space-between;gap:7px}.doc-title{font-weight:800;font-size:15px}.tag{font-size:11px;white-space:nowrap;border:1px solid #8d9daf99;border-radius:50px;padding:3px 8px}
.doc-info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:11px}.field{min-width:0}.field small{display:block;font-size:11px;opacity:.65;margin-bottom:3px}.field span{font-size:13px;overflow-wrap:anywhere}
.doc-tip{font-size:12px;opacity:.65;margin-top:10px}.doc[open] .doc-tip{display:none}
.history-extra{padding:12px 8px;text-align:center}
.history-extra button{width:100%;max-width:430px;font-size:13px}
.history-info{padding:8px 5px 3px;font-size:12px;line-height:1.65;opacity:.75}
.doc-details{padding:13px;border-top:1px solid #9caab855}.doc-details h3{font-size:14px;margin:3px 0 12px}.doc-details .tablewrap{max-height:45vh}
[hidden]{display:none!important}
@media(min-width:700px){body{max-width:1000px;margin:auto}.doc-info{grid-template-columns:repeat(4,minmax(0,1fr))}.tablewrap{max-height:74vh}}
</style></head><body>
<header>
<h1>XINGWANG STOCK</h1><p class="sub">Telegram 授权 · 本机实时查询 · 一次获取，点击切换</p>
<div class="modes" id="modes"><button class="on" data-mode="product">商品编号</button><button data-mode="nota">Nota / @ 预定</button></div>
<div class="search"><div class="entry"><input id="q" value="" placeholder="输入商品编号" autocomplete="off" enterkeyhint="search"/><button type="button" id="clear" class="clear" aria-label="清除搜索内容">×</button></div><button type="button" id="go">查询</button></div>
<div class="tabs" id="tabs">
<button class="on" data-tab="stock">库存</button><button data-tab="camino">待到货</button><button data-tab="history">历史购买</button><button data-tab="reservar">预定</button>
</div>
</header>
<main>
<div id="status">请输入编号后点击“查询”。</div>
<div id="stats" class="stats" hidden></div>
<div id="filterline" class="filterline" hidden><input id="filter" placeholder="筛选当前全部结果" autocomplete="off"/><span class="count" id="count"></span></div>
<div id="results"><div class="empty">等待查询</div></div>
<div id="note" class="hint"></div>
</main>
<script>
'use strict';
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();}
const $=id=>document.getElementById(id);
const alias=location.pathname==='/admin'?'ADMIN':'STOCK';
const fields={
 stock:[['code','商品编号'],['pieces','匹数'],['meters','米数'],['reserved','预定状态']],
 camino:[['code','商品编号'],['container','货柜'],['caja','匹数'],['units','米数'],['unit_type','单位'],['eta','到货日期']],
 history:[['date','日期'],['nota','Nota'],['customer','客户'],['code','商品编号'],['quantity','CAJA']],
 reservar:[['date','日期'],['code','商品编号'],['customer','客户'],['nota','预定单号']]
};
const titles={stock:'库存',camino:'待到货',history:'历史购买',reservar:'预定'};
let mode='product',tab='stock',sort='',desc=false,seq=0;
const cache={product:null,nota:null};const typed={product:'',nota:''};
const txt=(v)=>v===undefined||v===null||v===''?'—':typeof v==='number'?v.toLocaleString('en-US',{maximumFractionDigits:2}):String(v);
const node=(tag,val,klass)=>{const el=document.createElement(tag);if(val!==undefined)el.textContent=String(val);if(klass)el.className=klass;return el};
// Keep calendar dates independent of the phone timezone. Never show timestamp / GMT in history.
function historyDate(raw){
 if(raw===null||raw===undefined||raw==='')return '—';
 const str=String(raw).trim();
 let m=str.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?:$|[ T])/);
 if(m)return m[3].padStart(2,'0')+'-'+m[2].padStart(2,'0')+'-'+m[1];
 m=str.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})(?:$|\s)/);
 if(m)return m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0')+'-'+m[3];
 // Handle Flask's RFC-1123 dates such as "Sat, 10 Oct 2026 00:00:00 GMT".
 const d=new Date(raw);
 return Number.isNaN(d.getTime())?str:String(d.getUTCDate()).padStart(2,'0')+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+d.getUTCFullYear();
}
function incomingETA(raw){
 const text=txt(raw);
 // Do not repeat an Iquique, Chile destination beside its arrival date.
 return text.replace(/(?:\s*[,|·;]\s*|\s+)Iquique\s*,\s*Chile\s*$/i,'').trim()||text;
}
function tableValue(key,row){
 if(key==='reserved')return row.reserved?'有预定':'';
 if(key==='date')return historyDate(row[key]);
 if(key==='eta')return incomingETA(row[key]);
 return txt(row[key]);
}
function addField(parent,label,value){
 const f=node('div',undefined,'field');f.append(node('small',label),node('span',txt(value)));parent.append(f);
}
function updateClear(){$('clear').classList.toggle('visible',Boolean($('q').value));}
function showStatus(v){$('status').textContent=String(v);}
function clearOutput(message){
 $('stats').hidden=true;$('stats').replaceChildren();$('filterline').hidden=true;$('filter').value='';$('count').textContent='';$('note').textContent='';
 $('results').replaceChildren(node('div',message,'empty'));
}
function statsBox(rows){
 const out=$('stats');out.replaceChildren();out.hidden=false;
 for(const [label,value]of rows){const box=node('div',undefined,'stat');box.append(node('small',label),node('strong',txt(value)));out.append(box);}
}
function makeTable(rows,cols,attach){
 const wrap=node('div',undefined,'tablewrap');const table=node('table');wrap.append(table);
 const head=node('thead'),tr=node('tr');
 for(const [key,title]of cols){const th=node('th',title+(sort===key?(desc?' ▼':' ▲'):''),['pieces','meters','quantity','price','units','caja','total'].includes(key)?'num':'');
  if(attach){th.onclick=()=>{if(sort===key)desc=!desc;else{sort=key;desc=false;}render();};}
  tr.append(th);}
 head.append(tr);table.append(head);
 const tbody=node('tbody');
 for(const row of rows){
  const tr=node('tr');
  for(const [key]of cols){
    const td=node('td',undefined,['pieces','meters','quantity','price','units','caja','total'].includes(key)?'num':'');
    if(key==='customer'&&attach){
      const full=txt(row[key]);
      const button=node('button',full,'customer-short');
      button.type='button';button.title=full;button.setAttribute('aria-label','展开或收起完整客户名称：'+full);
      button.onclick=()=>{button.classList.toggle('expanded');};
      td.append(button);
    }else td.textContent=tableValue(key,row);
    tr.append(td);
  }
  tbody.append(tr);
}
 table.append(tbody);return wrap;
}
function drawProduct(){
 const snap=cache.product;if(!snap){clearOutput('请输入商品编号后查询');return;}
 const d=snap.data||{};const stock=d.rows||[],all=tab==='stock'?stock:(d[tab]||[]);
 const hasP=stock.some(x=>x.pieces!==null&&x.pieces!==undefined),hasM=stock.some(x=>x.meters!==null&&x.meters!==undefined);
 const pSum=hasP?stock.reduce((s,x)=>s+Number(x.pieces||0),0):'—';
 const mSum=hasM?stock.reduce((s,x)=>s+Number(x.meters||0),0):'—';
 const incoming=(d.camino_caja_total===null||d.camino_caja_total===undefined)?'—':d.camino_caja_total;
 const cards=[['商品种类',stock.length],['库存匹数',pSum],['库存米数',mSum],['待到货(匹)',incoming]];
 if(tab==='history'){cards.push(['近365天',d.history_recent_count??'—'],['最近交易',d.history_last_date||'—']);}
 statsBox(cards);
 let list=all.filter(r=>Object.values(r).some(v=>String(v??'').toLowerCase().includes($('filter').value.trim().toLowerCase())));
 if(sort){list=list.slice().sort((a,b)=>{let x=a[sort],y=b[sort];let n=typeof x==='number'&&typeof y==='number'?x-y:String(x??'').localeCompare(String(y??''),undefined,{numeric:true});return desc?-n:n;});}
 $('filterline').hidden=false;$('count').textContent=list.length+' / '+all.length+' 条';
 const cols=tab==='history'&&d.price_allowed?[...fields.history,['price','成交单价']]:fields[tab];
 $('results').replaceChildren(list.length?makeTable(list,cols,true):node('div','暂无符合条件的数据','empty'));
 if(tab==='history'){
   const recent=Number(d.history_recent_count||0), cursor=Number(d.history_next_cursor||0);
   const available=Number(d.history_retrievable_count??d.history_total_count??0);
   const info=node('div',undefined,'history-info');
   const backfill=Number(d.history_backfilled||0);
   info.textContent='近365天 '+recent+' 条；已显示 '+(d.history||[]).length+' / '+(d.history_total_count||0)+' 条历史'+
      (backfill>0?'（近一年较少，自动补充 '+backfill+' 条更早记录）':'')+
      '。预定记录不算购买。';
   $('results').append(info);
   if(cursor<available){
      const area=node('div',undefined,'history-extra'),btn=node('button',
        cursor<recent?'加载更多近一年记录（最多200条）':'查看更早的历史记录（最多200条）');
      btn.onclick=()=>loadHistoryPage(btn);
      area.append(btn);$('results').append(area);
   }
 }
 const issues=[];
 if(d.camino_caja_missing)issues.push('有 '+d.camino_caja_missing+' 条待到货未提供 CAJA，汇总仅包含已知数量');
 if(tab==='history'&&!d.price_allowed)issues.push('成交价格需管理员授权，当前未显示');
 if(d.warnings?.length)issues.push(...d.warnings);
 $('note').textContent='首次查询获取库存、待到货、购买摘要和预定；切换分类不重查。只有点击查看更多历史时才从本机缓存读取。'+(issues.length?' 提示：'+issues.join('；'):'');
}
async function loadHistoryPage(button){
 const snap=cache.product;if(!snap||!tg?.initData)return;
 const data=snap.data||{},cursor=Number(data.history_next_cursor||0);
 const recent=Number(data.history_recent_count||0);
 const includeOlder=cursor>=recent;
 const expected=seq,start=performance.now();
 button.disabled=true;button.textContent='正在加载历史记录…';
 try{
   const response=await fetch('/api/query',{method:'POST',cache:'no-store',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({bot:alias,action:'history_more',q:snap.q,init_data:tg.initData,
                        cursor,include_older:includeOlder})});
   const payload=await response.json();
   if(!response.ok||!payload.ok)throw Error(payload.error||'加载历史失败');
   if(expected!==seq||snap!==cache.product)return;
   const more=payload.data||{};
   data.history.push(...(more.rows||[]));
   data.history_next_cursor=more.next_cursor??(cursor+(more.rows||[]).length);
   data.history_has_more=more.has_more;
   const seconds=((performance.now()-start)/1000).toFixed(2);
   render();showStatus('加载历史耗时 '+seconds+' 秒 · 共显示 '+data.history.length+' 条');
 }catch(err){
   if(expected===seq){
     button.disabled=false;button.textContent='重试加载历史';
     showStatus(String(err.message||err));
   }
 }
}
function showNota(){
 const snap=cache.nota;if(!snap){clearOutput('请输入 Nota 前缀、客户名称，或 @ 查询预定记录');return;}
 const d=snap.data||{};$('filterline').hidden=true;$('results').replaceChildren();
 if(d.found===false){statsBox([['查询条件',snap.q],['状态','未找到']]);$('results').append(node('div','没有找到匹配的 Nota；不能据此判断是否出货。','empty'));return;}
 let docs=d.documents;
 if(!Array.isArray(docs)||!docs.length){
  if(d.kind==='nota'){docs=[{nota:d.nota,date:d.date,customer:d.customer,shipped_at:d.shipped_at,pilotero:d.pilotero,rows:d.rows||[]}];}
  else{
   const m=new Map();
   for(const r of d.rows||[]){const key=[r.customer||'',r.date||'',r.nota||''].join('|');if(!m.has(key))m.set(key,{customer:r.customer,date:r.date,nota:r.nota,rows:[]});m.get(key).rows.push(r);}
   docs=[...m.values()];
  }
 }
 const reserved=d.kind==='reservar';
 statsBox(reserved?[['预定分组',docs.length],['预定明细',d.rows?.length||0]]:[['查询条件',snap.q],['匹配单据',docs.length],['已加载商品',d.rows?.length||0]]);
 if(!docs.length){$('results').append(node('div','没有找到符合条件的记录','empty'));return;}
 for(const doc of docs){
  const detail=node('details',undefined,'doc'),summ=node('summary'),top=node('div',undefined,'doc-head');
  top.append(node('div',reserved?(doc.customer||'未知客户'):'Nota '+(doc.nota||snap.q),'doc-title'));
  top.append(node('span',reserved?'预定记录':doc.shipped_at?'查到出货日期':'未查到出货记录','tag'));
  summ.append(top);
  const cells=node('div',undefined,'doc-info');
  if(reserved){addField(cells,'日期',doc.date);addField(cells,'客户',doc.customer);addField(cells,'明细数量',(doc.rows||[]).length);}
  else{addField(cells,'开单日期',doc.date);addField(cells,'客户',doc.customer);addField(cells,'出货日期',doc.shipped_at);addField(cells,'承运人／司机（PILOTERO）',doc.pilotero);}
  summ.append(cells,node('div','点击展开商品明细  ▾','doc-tip'));detail.append(summ);
  const body=node('div',undefined,'doc-details');
  if(!reserved){const extra=node('div',undefined,'doc-info');addField(extra,'Nota',doc.nota);addField(extra,'BULTOS（原系统）',doc.bultos);body.append(extra);}
  body.append(node('h3',reserved?'预定商品明细':'Nota 商品明细'));
  const itemCols=reserved?[['code','商品编号']]:[['code','商品编号'],['caja','CAJA'],['quantity','UNT']];
  if(d.price_allowed){itemCols.push(...(reserved? [['amount','金额']]:[['price','单价'],['total','金额']]));}
  const detailRows=doc.rows||[];
  body.append(doc.details_loaded===false?node('div','商品明细尚未预取，请缩小查询范围','empty'):(detailRows.length?makeTable(detailRows,itemCols,false):node('div','此条记录暂无商品明细','empty')));
  detail.append(body);$('results').append(detail);
 }
 $('note').textContent=reserved?'@ 查询原系统 RESERVAR 预定记录。点击客户展开商品；金额仅管理员可查看。':
 '出货日期来自 CARGA_FECHA；PILOTERO 是原系统的承运人/司机字段，并不代表已经取得车牌号码。找不到日期只表示未查到出货记录。';
}
function render(){if(mode==='product')drawProduct();else showNota();}
function changeMode(next){
 if(next===mode)return;typed[mode]=$('q').value.trim();mode=next;++seq;
 $('go').disabled=false;$('filter').value='';sort='';desc=false;
 $('q').value=(typed[mode]||'').toLocaleUpperCase('es-CL');$('q').placeholder=mode==='nota'?'Nota 前缀 / 客户名称 / @ 预定':'输入商品编号';updateClear();
 $('tabs').hidden=mode==='nota';
 for(const b of $('modes').querySelectorAll('[data-mode]'))b.classList.toggle('on',b.dataset.mode===mode);
 $('q').blur();$('filter').blur();
 showStatus(cache[mode]?'耗时 '+cache[mode].elapsedSeconds.toFixed(2)+' 秒 · 显示已查询的数据，无需重新请求':'请输入编号后点击“查询”。');
 render();
}
function changeTab(next){
 if(next===tab||mode!=='product')return;tab=next;sort='';desc=false;$('filter').value='';
 for(const b of $('tabs').querySelectorAll('[data-tab]'))b.classList.toggle('on',b.dataset.tab===tab);
 showStatus(cache.product?'耗时 '+cache.product.elapsedSeconds.toFixed(2)+' 秒 · 正在查看“'+titles[tab]+'”，无需重新查询':'请先输入商品编号');
 render();
}
async function search(){
 const q=$('q').value.trim().toLocaleUpperCase('es-CL'),init=tg?.initData||'',id=++seq,using=mode,startMs=performance.now();
 if(!init){showStatus('请通过 Telegram Mini App 打开页面，普通浏览器不能查询。');return;}
 if(using==='nota'){
   const validNumeric=/^\d{1,5}$/.test(q);
   const validName=q.length>=2&&q.length<=40&&[...q].some(c=>/\p{L}/u.test(c))&&
       [...q].every(c=>/[\p{L}\p{N} .,'&/\-]/u.test(c));
   if(!(validNumeric||validName||q==='@')){
     showStatus('请输入 1～5 位 Nota 开头数字、客户名称（如 M Y M），或 @ 查询预定');
     return;
   }
 }
 if(using==='product'&&!/^[A-Za-z0-9][A-Za-z0-9_.()\/\-]{1,39}$/.test(q)){showStatus('请输入正确的商品编号');return;}
 typed[using]=q;cache[using]=null;sort='';desc=false;clearOutput('正在从本机获取完整数据……');
 $('go').disabled=true;showStatus(using==='nota'?'正在查询匹配 Nota / 预定记录……':'正在一次获取库存、待到货、历史购买和预定记录……');
 try{
  const res=await fetch('/api/query',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({bot:alias,action:using==='nota'?'nota':'stock',q,init_data:init})});
  const value=await res.json();if(!res.ok||!value.ok)throw new Error(value.error||value.detail||'查询失败');
  if(id!==seq)return;
  const elapsedSeconds=(performance.now()-startMs)/1000;
  cache[using]={q,data:value.data||{},elapsedSeconds};render();
  showStatus('耗时 '+elapsedSeconds.toFixed(2)+' 秒 · 展开明细或切换分类无需重新查询');
 }catch(e){
  if(id!==seq)return;
  clearOutput('查询未完成，不能作为零库存或未出货的依据');showStatus(String(e.message||e));
 }finally{if(id===seq)$('go').disabled=false;}
}
let composing=false;
function inputUppercase(){
  if(!composing){
    const input=$('q'),previous=input.value,next=previous.toLocaleUpperCase('es-CL');
    if(previous!==next){
      const start=input.selectionStart,end=input.selectionEnd;
      input.value=next;
      if(start!==null && end!==null){
        try{input.setSelectionRange(start,end);}catch(_){} 
      }
    }
  }
  updateClear();
}
$('q').addEventListener('compositionstart',()=>{composing=true;});
$('q').addEventListener('compositionend',()=>{composing=false;inputUppercase();});
$('q').addEventListener('input',inputUppercase);
$('clear').addEventListener('click',()=>{$('q').value='';updateClear();$('q').focus();});
$('go').addEventListener('click',search);
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search();});
$('modes').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(b)changeMode(b.dataset.mode);});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)changeTab(b.dataset.tab);});
$('filter').addEventListener('input',render);
// Input deliberately starts blank even if Telegram supplied a startapp parameter.
// Avoid auto-querying after opening the Mini App.
$('q').value='';updateClear();
if(!tg?.initData)showStatus('请从 Telegram 授权的 Mini App 入口打开；普通浏览器不能查询。');
</script></body></html>
