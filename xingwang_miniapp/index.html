<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/><title>XINGWANG · 業務查詢</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color-scheme:light dark}
*{box-sizing:border-box}body{margin:0;width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;background:var(--tg-theme-bg-color,#f6f7fb);color:var(--tg-theme-text-color,#13223a)}
header{position:sticky;top:0;z-index:5;background:var(--tg-theme-bg-color,#f6f7fb);border-bottom:1px solid #a0b3c355;padding:15px 12px 10px}
h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.02em}.sub{font-size:11px;opacity:.7;margin:5px 0 11px}
.mainmodes,.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.mainmodes button,.tabs button{background:var(--tg-theme-secondary-bg-color,#e8eef4);color:inherit;white-space:nowrap;font-size:13px}
.mainmodes button{flex:1}.tabs button{padding:10px 12px;flex-shrink:0}.mainmodes button.active,.tabs button.active{background:var(--tg-theme-button-color,#2381cb);color:var(--tg-theme-button-text-color,#fff)}
.search{display:flex;gap:8px;margin:12px 0}.search input{flex:1;min-width:0;width:100%;border:1px solid #a7b6c4;border-radius:12px;padding:12px;font-size:16px;background:var(--tg-theme-secondary-bg-color,#fff);color:inherit}
button{border:0;border-radius:10px;padding:11px 14px;cursor:pointer;font-weight:700;background:var(--tg-theme-button-color,#2381cb);color:var(--tg-theme-button-text-color,#fff)}button:disabled{opacity:.5}
main{padding:12px 12px calc(35px + env(safe-area-inset-bottom,0px))}
#status{font-size:13px;line-height:1.6;margin:2px 0 10px;white-space:pre-wrap}
.stats{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}.stat{padding:12px;border-radius:12px;background:var(--tg-theme-secondary-bg-color,#fff);min-width:105px;flex:1}.stat span{font-size:11px;display:block;opacity:.65}.stat strong{font-size:18px;display:block;margin-top:3px}
.toolbar{display:flex;gap:8px;align-items:center;margin:10px 0}.toolbar input{flex:1;min-width:0;border:1px solid #9dabbd;border-radius:11px;padding:10px;font-size:16px;color:inherit;background:var(--tg-theme-secondary-bg-color,#fff)}.count{font-size:12px;white-space:nowrap;opacity:.65}
.tablewrap{overflow:auto;max-height:62vh;min-height:125px;border-radius:13px;background:var(--tg-theme-secondary-bg-color,#fff)}
table{border-collapse:collapse;min-width:100%;font-size:13px}
th,td{padding:11px 10px;border-bottom:1px solid #9cabbb36;white-space:nowrap;text-align:left}
th{position:sticky;top:0;background:var(--tg-theme-secondary-bg-color,#fff);font-size:12px;cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums}.empty{padding:28px;text-align:center;opacity:.7}.note{font-size:12px;line-height:1.65;opacity:.73;margin-top:13px}
[hidden]{display:none!important}
@media(min-width:700px){body{max-width:1050px;margin:auto}.tablewrap{max-height:75vh}}
</style></head><body>
<header><h1>XINGWANG STOCK</h1><div class="sub">同一個 Bot · 一次查詢 · 各頁籤共用本機即時結果</div>
<div class="mainmodes" id="modes"><button data-mode="product" class="active">商品編號查詢</button><button data-mode="nota">Nota / @ Reservar</button></div>
<div class="search"><input id="q" autocomplete="off" value="1314" placeholder="輸入商品編號，例如 1314"/><button id="go">查詢</button></div>
<div class="tabs" id="tabs">
<button class="active" data-tab="stock">庫存</button>
<button data-tab="camino">在途</button>
<button data-tab="history">歷史購買</button>
<button data-tab="prices">價格</button>
<button data-tab="reservar">Reservar</button>
</div></header>
<main>
<div id="status">請在 Telegram Mini App 輸入商品編號。</div>
<div id="stats" class="stats" hidden></div>
<div class="toolbar"><input id="filter" placeholder="篩選目前頁籤全部結果" autocomplete="off"/><span class="count" id="count"></span></div>
<div id="results" class="tablewrap"><div class="empty">等待查詢</div></div>
<div class="note" id="note"></div>
</main>
<script>
'use strict';
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();}
const $=id=>document.getElementById(id);
const alias=location.pathname==='/admin'?'ADMIN':'STOCK';
const columns={
 stock:[['code','編號'],['pieces','匹數'],['meters','米數']],
 camino:[['code','編號'],['container','貨櫃'],['units','Unt'],['unit_type','單位'],['eta','日期']],
 history:[['date','日期'],['code','編號'],['customer','客戶'],['nota','Nota'],['quantity','Caja']],
 prices:[['date','日期'],['code','編號'],['customer','客戶'],['nota','Nota'],['price','價格']],
 reservar:[['date','日期'],['code','編號'],['customer','客戶'],['nota','Nota']],
 nota:[['code','商品編號'],['customer','客戶'],['quantity','Unt']],
 allres:[['date','日期'],['code','編號'],['customer','客戶'],['nota','預留']]
};
const labels={stock:'庫存',camino:'在途',history:'歷史購買',prices:'價格',reservar:'Reservar'};
let mode='product',tab='stock',sort='',desc=false,requestId=0;
const snapshots={product:null,nota:null},queries={product:'1314',nota:''};
const format=v=>v===null||v===undefined||v===''?'—':typeof v==='number'?v.toLocaleString('en-US',{maximumFractionDigits:2}):String(v);
const make=(tag,value,cls)=>{const x=document.createElement(tag);if(value!==undefined)x.textContent=String(value);if(cls)x.className=cls;return x;};
function rowsForTab(){
 const payload=snapshots[mode]?.data||{};
 if(mode==='nota')return payload.rows||[];
 return tab==='stock'?(payload.rows||[]):(payload[tab]||[]);
}
function viewColumns(){if(mode==='nota')return columns[snapshots.nota?.data?.kind==='reservar'?'allres':'nota'];return columns[tab];}
function draw(){
 const body=$('results');body.replaceChildren();
 const snap=snapshots[mode];if(!snap){body.append(make('div','請輸入編號，再按「查詢」','empty'));$('count').textContent='';return;}
 const payload=snap.data||{};
 if(mode==='product'&&tab==='prices'&&!payload.price_allowed){
  body.append(make('div','價格查詢需要管理員授權。本機 Python 未開放此 Bot 的 prices 權限。','empty'));$('count').textContent='未授權';return;
 }
 let rows=rowsForTab(),filter=$('filter').value.trim().toLowerCase();
 let shown=filter?rows.filter(r=>Object.values(r).some(v=>String(v??'').toLowerCase().includes(filter))):rows.slice();
 const cols=viewColumns();
 if(sort)shown.sort((a,b)=>{let x=a[sort],y=b[sort];const cmp=(typeof x==='number'&&typeof y==='number')?x-y:String(x??'').localeCompare(String(y??''),undefined,{numeric:true});return desc?-cmp:cmp;});
 $('count').textContent=shown.length+' / '+rows.length+' 筆';
 if(shown.length===0){body.append(make('div',mode==='nota'&&payload.found===false?'未找到 Nota '+queries.nota:'沒有符合資料','empty'));return;}
 const table=make('table'),thead=make('thead'),tr=make('tr');
 for(const [k,title] of cols){const th=make('th',title+(sort===k?(desc?' ▼':' ▲'):''),['pieces','meters','units','quantity','price'].includes(k)?'num':'');th.onclick=()=>{if(sort===k)desc=!desc;else{sort=k;desc=false;}draw();};tr.append(th);}
 thead.append(tr);table.append(thead);
 const tbody=make('tbody');for(const row of shown){const tr=make('tr');for(const [k] of cols)tr.append(make('td',format(row[k]),['pieces','meters','units','quantity','price'].includes(k)?'num':''));tbody.append(tr);}table.append(tbody);body.append(table);
}
function details(){
 const holder=$('stats');holder.replaceChildren();
 const snap=snapshots[mode];if(!snap){holder.hidden=true;$('note').textContent='';draw();return;}
 const p=snap.data||{};const stock=p.rows||[];
 let items;
 if(mode==='product'){
  items=[['編號',stock.length],['匹數',format(stock.reduce((n,r)=>n+Number(r.pieces||0),0))],
  ['米數',format(stock.reduce((n,r)=>n+Number(r.meters||0),0))],['在途',p.camino?.length||0],
  ['歷史',p.history?.length||0],['預留',p.reservar?.length||0]];
  $('note').textContent='歷史的 Caja 保留原始欄位名稱；在途 Unt 也保留原始單位，不把箱數當成匹數。價格以本機權限為準。';
 }else if(p.kind==='reservar'){
  items=[['Reservar 筆數',stock.length]];$('note').textContent='輸入 @ 查預留紀錄；顯示的是原系統的 Reservar，不是 R1/S1/RVA。';
 }else{
  items=[['Nota',p.nota||queries.nota],['客戶',p.customer||'—'],
  ['出貨',p.shipment_status||'未查到'],['出貨日期',p.shipped_at||'—'],['商品',stock.length]];
  $('note').textContent='已開 Nota 不等於已出貨；出貨狀態依本機 CARGA 日期判斷，沒有紀錄只表示未查到。商品數量欄保留原始 UNT 單位。';
 }
 holder.hidden=false;for(const [label,val] of items){const c=make('div',undefined,'stat');c.append(make('span',label),make('strong',val));holder.append(c);}draw();
}
function switchMode(next){
 if(next===mode)return;queries[mode]=$('q').value.trim();mode=next;++requestId;
 $('go').disabled=false;sort='';desc=false;$('filter').value='';
 for(const button of $('modes').querySelectorAll('[data-mode]'))button.classList.toggle('active',button.dataset.mode===mode);
 $('tabs').hidden=mode==='nota';
 $('q').value=queries[mode];$('q').placeholder=mode==='nota'?'輸入五位數 Nota，或 @ 查 Reservar':'輸入商品編號，例如 1314';
 $('status').textContent=snapshots[mode]?'顯示先前已查回的資料（切換不重新查詢）':'請輸入編號後按查詢';
 details();
}
function selectTab(next){
 if(mode!=='product'||next===tab)return;tab=next;sort='';desc=false;$('filter').value='';
 for(const button of $('tabs').querySelectorAll('[data-tab]'))button.classList.toggle('active',button.dataset.tab===tab);
 $('status').textContent=snapshots.product?'正在顯示「'+labels[tab]+'」，沒有重新呼叫 API':'請先查商品編號';
 details();
}
async function search(){
 const q=$('q').value.trim(),initData=tg?.initData||'',myReq=++requestId,currentMode=mode;
 if(!initData){$('status').textContent='只能從 Telegram 授權的 Mini App 開啟';return;}
 if(currentMode==='product'&&!/^[A-Za-z0-9][A-Za-z0-9_.()\/\-]{1,39}$/.test(q)){$('status').textContent='請輸入商品編號';return;}
 if(currentMode==='nota'&&!(/^\d{5}$/.test(q)||q==='@')){$('status').textContent='請輸入五位數 Nota，或 @ 查 Reservar';return;}
 queries[currentMode]=q;snapshots[currentMode]=null;$('stats').hidden=true;$('count').textContent='';$('note').textContent='';$('filter').value='';$('results').replaceChildren(make('div','正在取得本機資料…','empty'));
 $('go').disabled=true;$('status').textContent=currentMode==='product'?'正在一次取得庫存、在途、歷史、價格與 Reservar…':'正在查詢 Nota / Reservar…';
 try{
  const res=await fetch('/api/query',{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({bot:alias,action:currentMode==='product'?'stock':'nota',q,init_data:initData})});
  const body=await res.json();if(!res.ok||!body.ok)throw Error(body.error||body.detail||'查詢失敗');
  if(myReq!==requestId)return;
  snapshots[currentMode]={q,data:body.data||{}};sort='';desc=false;details();
  $('status').textContent='查詢完成 · '+new Date().toLocaleTimeString()+' · 切換 Tab 不會重新打 API';
 }catch(e){
  if(myReq!==requestId)return;
  snapshots[currentMode]=null;$('stats').hidden=true;$('results').replaceChildren(make('div','查詢失敗，不代表零庫存／Nota 不存在','empty'));$('count').textContent='';
  $('status').textContent=String(e.message||e);
 }finally{if(myReq===requestId)$('go').disabled=false;}
}
$('go').onclick=search;$('q').onkeydown=e=>{if(e.key==='Enter')search();};
$('filter').oninput=draw;
$('modes').onclick=e=>{const b=e.target.closest('[data-mode]');if(b)switchMode(b.dataset.mode);};
$('tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b)selectTab(b.dataset.tab);};
const launch=String(tg?.initDataUnsafe?.start_param||'').trim();
if(/^[A-Za-z0-9][A-Za-z0-9_.()\/\-]{1,39}$/.test(launch)){queries.product=launch;$('q').value=launch;}
if(!tg?.initData)$('status').textContent='請從 Telegram Mini App 開啟；一般瀏覽器無法查詢。';
else if(launch)search();
</script></body></html>
