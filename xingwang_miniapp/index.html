<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>XINGWANG STOCK</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light dark}
*{box-sizing:border-box}body{width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;margin:0;background:var(--tg-theme-bg-color,#f6f7fb);color:var(--tg-theme-text-color,#14243a)}
header{padding:16px 14px 10px;background:var(--tg-theme-bg-color,#f6f7fb);border-bottom:1px solid #b4c0cd77;position:sticky;top:0;z-index:10}
h1{font-size:18px;margin:0}.sub{font-size:12px;opacity:.7;margin-top:4px}.search{display:flex;gap:8px;margin:13px 0}
input{min-width:0;max-width:100%;flex:1;padding:12px;border:1px solid #a1adba;border-radius:12px;font-size:16px;color:inherit;background:var(--tg-theme-secondary-bg-color,#fff)}
button{border:0;border-radius:11px;padding:11px 12px;background:var(--tg-theme-button-color,#277fc1);color:var(--tg-theme-button-text-color,#fff);font-weight:700;cursor:pointer}
button:disabled{opacity:.5}.tabs{display:flex;gap:7px;overflow:auto}.tab{flex:1;white-space:nowrap;font-size:13px;background:var(--tg-theme-secondary-bg-color,#e9eff4);color:inherit}
.tab.active{background:var(--tg-theme-button-color,#277fc1);color:var(--tg-theme-button-text-color,#fff)}
main{padding:12px 12px calc(32px + env(safe-area-inset-bottom,0px))}.status{font-size:13px;margin-bottom:8px;min-height:20px}.stats{display:flex;gap:8px;margin:10px 0}
.stat{min-width:0;flex:1;padding:12px 9px;border-radius:13px;background:var(--tg-theme-secondary-bg-color,#fff)}.stat span{display:block;font-size:11px;opacity:.7}.stat strong{font-size:19px}
.filters{display:flex;gap:9px;align-items:center;margin:10px 0}.filters input{padding:10px;font-size:16px}.count{font-size:12px;white-space:nowrap}
.wrap{overflow:auto;max-height:65vh;background:var(--tg-theme-secondary-bg-color,#fff);border-radius:13px}
table{border-collapse:collapse;min-width:100%;font-size:13px}th,td{border-bottom:1px solid #b4c0cd45;white-space:nowrap;text-align:left;padding:12px 10px}
th{position:sticky;top:0;background:var(--tg-theme-secondary-bg-color,#fff);cursor:pointer;font-size:12px}
.qty{text-align:right;font-variant-numeric:tabular-nums}.empty{padding:28px;text-align:center;opacity:.7}.note{font-size:12px;opacity:.7;margin-top:12px;line-height:1.6}
@media(min-width:700px){body{max-width:980px;margin:auto}.wrap{max-height:75vh}}
</style></head><body>
<header><h1>XINGWANG STOCK</h1><div class="sub">Telegram 授權 · 本機即時查詢 · 不儲存業務資料</div>
<div class="search"><input id="q" value="1314" placeholder="輸入商品編號" autocomplete="off">
<button id="go">查詢</button></div>
<div class="tabs" id="tabs"><button class="tab active" data-action="stock">庫存</button><button class="tab" data-action="camino">在途</button><button class="tab" data-action="orders">訂單</button><button class="tab" data-action="nota">Nota</button></div></header>
<main>
<div class="status" id="status">請在 Telegram 開啟 Mini App 後查詢</div>
<div class="stats" id="stats" hidden></div>
<div class="filters"><input id="filter" placeholder="在全部結果中篩選"/><span class="count" id="count"></span></div>
<div class="wrap" id="wrap"><div class="empty">等待查詢</div></div>
<div class="note" id="note"></div>
</main><script>
'use strict';
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
const el=id=>document.getElementById(id);
const fields={stock:['code','pieces','meters'],camino:['code','container','units','unit_type','eta'],orders:['order','customer','product','quantity','status','source'],nota:['code','quantity']};
const captions={code:'商品編號',pieces:'匹數',meters:'米數',container:'櫃號',units:'在途數量(Unt)',unit_type:'單位(Tipo)',eta:'到港資訊',order:'訂單號',customer:'客戶',product:'商品名稱',quantity:'數量',status:'狀態',source:'來源'};
const alias=location.pathname==='/admin'?'ADMIN':'STOCK';
let action='stock',rows=[],sort='',desc=false,seq=0,notaState=null;
const queries={stock:"1314",camino:"1314",orders:"",nota:""};
const actionLabels={stock:"庫存",camino:"在途",orders:"訂單",nota:"Nota"};
const fmt=v=>v===null||v===undefined||v===''?'—':typeof v==='number'?v.toLocaleString('en-US',{maximumFractionDigits:2}):String(v);
function elem(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n;}
function draw(){
 const f=el('filter').value.toLowerCase().trim();
 let visible=rows.filter(r=>Object.values(r).some(v=>String(v??'').toLowerCase().includes(f)));
 if(sort)visible=visible.slice().sort((a,b)=>{const av=a[sort],bv=b[sort];let diff=(typeof av==='number'&&typeof bv==='number')?av-bv:String(av??'').localeCompare(String(bv??''),undefined,{numeric:true});return desc?-diff:diff;});
 el('count').textContent=visible.length+' / '+rows.length+' 筆';
 const wrap=el('wrap');wrap.replaceChildren();
 if(!visible.length){const message=action==='nota'&&notaState?(notaState.found===false?'沒有找到 Nota：'+(notaState.nota||''):rows.length===0?'Nota 已找到，但沒有商品明細':'沒有符合篩選條件的商品'):'沒有符合資料';wrap.append(elem('div',message,'empty'));return;}
 const t=elem('table'),head=elem('thead'),hrow=elem('tr');
 for(const field of fields[action]){const th=elem('th',captions[field]+(sort===field?(desc?' ▼':' ▲'):''));if(['pieces','meters','quantity','units'].includes(field))th.className='qty';th.addEventListener('click',()=>{if(sort===field)desc=!desc;else{sort=field;desc=false;}draw();});hrow.append(th);}
 head.append(hrow);t.append(head);
 const body=elem('tbody');for(const row of visible){const tr=elem('tr');for(const field of fields[action])tr.append(elem('td',fmt(row[field]),['pieces','meters','quantity'].includes(field)?'qty':''));body.append(tr);}
 t.append(body);wrap.append(t);
}
function stats(payload){
 const holder=el('stats');holder.replaceChildren();holder.hidden=false;
 const all=payload.rows||[]; const hasPieces=all.some(r=>r.pieces!==null&&r.pieces!==undefined);
 const hasMeters=all.some(r=>r.meters!==null&&r.meters!==undefined);
 const items=action==='stock'?[
   ['商品編號',all.length],
   ['庫存匹數',hasPieces?fmt(all.reduce((n,r)=>n+Number(r.pieces||0),0)):'—'],
   ['庫存米數',hasMeters?fmt(all.reduce((n,r)=>n+Number(r.meters||0),0)):'—'],
   ['在途筆數',(payload.camino||[]).length]
 ]:action==='nota'?[['Nota',payload.nota||'—'],['狀態',payload.found===false?'未找到':'已找到'],['商品明細',all.length]]:[['查詢筆數',all.length]];
 for(const [label,val]of items){
   const card=elem('div',undefined,'stat');card.append(elem('span',label),elem('strong',val));holder.append(card);
 }
 el('note').textContent=action==='stock'?
   '匹數：沿用本機「Mostrar / Datos de Inventario」的 Cantidad；米數：本機庫存 API 的 Un。兩者按商品編號合併，每次查詢即時取得。':'';
}
async function search(){
 const q=el('q').value.trim(),init=tg?.initData||'',requestId=++seq;
 if(!init){el('status').textContent='請從 Telegram 官方 Mini App 入口開啟；一般瀏覽器不能查資料。';return;}
 if(!q){el('status').textContent='請輸入查詢內容';return;}
 queries[action]=q;el('go').disabled=true;el('status').textContent='正在查詢'+actionLabels[action]+'，向本機取得最新資料…';
 try{
 const response=await fetch('/api/query',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({bot:alias,action,q,init_data:init})});
 const body=await response.json();if(!response.ok||!body.ok)throw Error(body.error||body.detail||(response.status===503?'本機尚未連線，請確認 Windows Bot 正在運行。':'查詢失敗'));
 if(requestId!==seq)return;
 rows=body.data?.rows||[];notaState=action==='nota'?(body.data||{}):null;sort='';desc=false;el('filter').value='';stats(body.data||{});draw();
 el('status').textContent='已取得本機即時資料 · '+new Date().toLocaleTimeString();
 }catch(err){if(requestId!==seq)return;rows=[];el('stats').hidden=true;el('note').textContent='';el('count').textContent='';el('wrap').replaceChildren(elem('div','查詢未完成（不是庫存零筆）','empty'));el('status').textContent=String(err.message||err);}
 finally{if(requestId===seq)el('go').disabled=false;}
}
el('go').addEventListener('click',search);el('q').addEventListener('keydown',e=>{if(e.key==='Enter')search();});el('filter').addEventListener('input',draw);
el('tabs').addEventListener('click',e=>{
 const target=e.target.closest('[data-action]');
 if(!target||target.dataset.action===action)return;
 const previous=action;
 queries[previous]=el('q').value.trim();
 action=target.dataset.action;
 ++seq; // invalidate responses sent for the previous tab
 el('go').disabled=false;
 el('q').blur();el('filter').blur();
 for(const b of el('tabs').querySelectorAll('.tab'))b.classList.toggle('active',b===target);
 if((action==='stock'||action==='camino')&&(previous==='stock'||previous==='camino')&&!queries[action]){
   queries[action]=queries[previous];
 }
 el('q').value=queries[action]||'';
 el('q').placeholder=action==='nota'?'輸入 Nota 單號（不是商品編號）':action==='orders'?'輸入訂單號或客戶名稱':'輸入商品編號';
 rows=[];notaState=null;sort='';desc=false;el('filter').value='';el('stats').hidden=true;el('count').textContent='';
 el('wrap').replaceChildren(elem('div','請輸入'+(action==='nota'?'Nota 單號':action==='orders'?'訂單號或客戶名稱':'商品編號')+'後按「查詢」','empty'));
 el('status').textContent=actionLabels[action]+'查詢 · 等待輸入';
 // Keep stock/camino convenient; do not accidentally query an old stock code as Nota or order number.
 if((action==='stock'||action==='camino')&&el('q').value)search();
});
const startCode=String(tg?.initDataUnsafe?.start_param||'').trim();
if(/^[A-Za-z0-9][A-Za-z0-9_.()/\\-]{1,39}$/.test(startCode)){el('q').value=startCode;queries.stock=startCode;queries.camino=startCode;}
if(!tg?.initData){el('status').textContent='請從 @XINGWANG_STOCK_BOT 的 Main Mini App 入口開啟；一般瀏覽器無法登入。';}
else if(startCode){search();}
</script></body></html>
