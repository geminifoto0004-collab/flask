{% extends "tracking/base.html" %}

{% block title %}通知记录{% endblock %}

{% block extra_css %}
<style>
.notif-audit-page { padding: 1.5rem 2rem; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.notif-audit-page .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-shrink: 0; }
.notif-audit-page .page-title { font-size: 1.4rem; font-weight: 700; color: #1a1a1a; }
.notif-audit-page .page-subtitle { font-size: 0.85rem; color: #999; margin-top: 2px; }

/* 设置区 */
.setting-card { background: #fff; border: 1px solid #ffe0e0; border-radius: 14px; padding: 14px 20px; margin-bottom: 1rem; display: flex; align-items: center; gap: 1rem; flex-shrink: 0; }
.setting-card label { font-size: 0.88rem; font-weight: 500; color: #333; white-space: nowrap; }
.setting-card .setting-input { width: 70px; padding: 6px 10px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 0.88rem; text-align: center; }
.setting-card .setting-input:focus { outline: none; border-color: #ff2442; box-shadow: 0 0 0 2px rgba(255, 36, 66, 0.1); }
.setting-card .setting-unit { font-size: 0.85rem; color: #666; }
.setting-card .setting-save-btn { padding: 6px 16px; border: none; border-radius: 8px; background: #ff2442; color: #fff; font-size: 0.82rem; font-weight: 500; cursor: pointer; transition: all 0.2s; }
.setting-card .setting-save-btn:hover { background: #e01e3a; }
.setting-card .setting-hint { font-size: 0.78rem; color: #999; margin-left: auto; }

/* 筛选栏 */
.filter-bar { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.8rem; flex-shrink: 0; }
.filter-bar .filter-select, .filter-bar .filter-input { padding: 7px 12px; border: 1px solid #e0e0e0; border-radius: 10px; font-size: 0.82rem; background: #fff; color: #333; }
.filter-bar .filter-select:focus, .filter-bar .filter-input:focus { outline: none; border-color: #ff2442; }
.filter-bar .filter-input { width: 180px; }
.filter-bar .filter-input.date-input { width: 130px; }
.date-range-group { display: inline-flex; align-items: center; gap: 4px; background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 0 8px; }
.date-range-group:focus-within { border-color: #ff2442; }
.date-range-group .filter-input.date-input { border: none; padding: 7px 4px; width: 120px; border-radius: 0; }
.date-range-group .filter-input.date-input:focus { outline: none; box-shadow: none; }
.date-range-sep { color: #ccc; font-size: 0.85rem; user-select: none; }
.filter-bar .filter-btn { padding: 7px 16px; border: none; border-radius: 10px; background: #ff2442; color: #fff; font-size: 0.82rem; font-weight: 500; cursor: pointer; }
.filter-bar .filter-btn:hover { background: #e01e3a; }
.filter-bar .filter-btn-reset { background: #f5f5f5; color: #666; border: 1px solid #e0e0e0; }
.filter-bar .filter-btn-reset:hover { background: #eee; }

/* 表格 */
.audit-table-wrapper { flex: 1; overflow: auto; background: #fff; border: 1px solid #ffe0e0; border-radius: 14px; }
.audit-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
.audit-table thead { position: sticky; top: 0; z-index: 2; }
.audit-table th { background: #fff5f5; padding: 10px 12px; text-align: left; font-weight: 600; color: #333; border-bottom: 2px solid #ffe0e0; white-space: nowrap; }
.audit-table td { padding: 9px 12px; border-bottom: 1px solid #f5f5f5; color: #333; vertical-align: middle; }
.audit-table tbody tr:hover { background: #fff8f8; }

/* 类型标签 */
.notif-type-tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 500; }
.notif-type-tag.order_unlocked { background: #e8f5e9; color: #2e7d32; }
.notif-type-tag.workflow_transferred { background: #e3f2fd; color: #1565c0; }
.notif-type-tag.delivery_warning { background: #fff8e1; color: #f57f17; }
.notif-type-tag.delivery_overdue { background: #fce4ec; color: #c62828; }
.notif-type-tag.red_light { background: #fce4ec; color: #c62828; }
.notif-type-tag.order_locked { background: #f3e5f5; color: #6a1b9a; }

/* 角色标签 */
.user-role-tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 0.72rem; margin-left: 4px; }
.user-role-tag.admin { background: #fce4ec; color: #c62828; }
.user-role-tag.sales { background: #e3f2fd; color: #1565c0; }
.user-role-tag.viewer { background: #f5f5f5; color: #666; }

/* 已读状态 */
.read-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 0.75rem; padding: 2px 8px; border-radius: 6px; }
.read-badge.read { background: #e8f5e9; color: #2e7d32; }
.read-badge.unread { background: #fff3e0; color: #e65100; }

/* 分页 */
.pagination { display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.8rem; flex-shrink: 0; }
.pagination button { padding: 6px 14px; border: 1px solid #e0e0e0; border-radius: 8px; background: #fff; color: #333; font-size: 0.82rem; cursor: pointer; }
.pagination button:hover:not(:disabled) { background: #fff5f5; border-color: #ff2442; }
.pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
.pagination .page-info { font-size: 0.82rem; color: #666; }

/* 空状态 */
.empty-state { text-align: center; padding: 3rem; color: #999; }
.empty-state svg { opacity: 0.3; margin-bottom: 1rem; }
</style>
{% endblock %}

{% block content %}
<div class="notif-audit-page">
    <div class="page-header">
        <div>
            <h1 class="page-title">通知记录</h1>
            <p class="page-subtitle">查询数据库当前保留的通知记录，共 <strong id="auditTotalCount">0</strong> 条 · <span id="auditLastRefresh" style="color:#999;font-size:0.78rem;">每 10 秒自动刷新</span></p>
        </div>
    </div>

    <!-- 设置区：通知保留天数 -->
    <div class="setting-card">
        <label>通知保留天数：</label>
        <input type="number" id="settingVisibleDays" class="setting-input" min="1" max="365" value="30">
        <span class="setting-unit">天后自动删除</span>
        <button class="setting-save-btn" onclick="saveVisibleDays()">保存</button>
        <span class="setting-hint">超过保留天数后将从数据库自动删除</span>
    </div>

    <!-- 筛选栏 -->
    <div class="filter-bar">
        <select id="auditUserFilter" class="filter-select">
            <option value="">所有用户</option>
        </select>
        <select id="auditTypeFilter" class="filter-select">
            <option value="">所有类型</option>
            <option value="order_unlocked">订单解锁</option>
            <option value="order_locked">订单锁定</option>
            <option value="workflow_transferred">流程转让</option>
            <option value="delivery_warning">交期预警</option>
            <option value="delivery_overdue">交期逾期</option>
            <option value="red_light">红灯停滞</option>
        </select>
        <select id="auditReadFilter" class="filter-select">
            <option value="">已读/未读</option>
            <option value="read">已读</option>
            <option value="unread">未读</option>
        </select>
        <input type="text" id="auditKeyword" class="filter-input" placeholder="搜索标题/订单号/流程号...">
        <span class="date-range-group">
            <input type="date" id="auditDateFrom" class="filter-input date-input" title="开始日期">
            <span class="date-range-sep">~</span>
            <input type="date" id="auditDateTo" class="filter-input date-input" title="结束日期">
        </span>
        <button class="filter-btn" onclick="loadAuditNotifications(1)">查询</button>
        <button class="filter-btn filter-btn-reset" onclick="resetAuditFilters()">重置</button>
    </div>

    <!-- 表格 -->
    <div class="audit-table-wrapper">
        <table class="audit-table">
            <thead>
                <tr>
                    <th>时间</th>
                    <th>接收人</th>
                    <th>类型</th>
                    <th>标题</th>
                    <th>详情</th>
                    <th>订单号</th>
                    <th>流程号</th>
                    <th>状态</th>
                    <th>已读时间</th>
                </tr>
            </thead>
            <tbody id="auditTableBody">
                <tr><td colspan="9" class="empty-state">加载中...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- 分页 -->
    <div class="pagination">
        <button id="auditPrevBtn" onclick="loadAuditNotifications(currentAuditPage - 1)" disabled>上一页</button>
        <span class="page-info" id="auditPageInfo">第 1 页</span>
        <button id="auditNextBtn" onclick="loadAuditNotifications(currentAuditPage + 1)" disabled>下一页</button>
    </div>
</div>

<script>
const TYPE_LABELS = {
    'order_unlocked': '订单解锁',
    'order_locked': '订单锁定',
    'workflow_transferred': '流程转让',
    'delivery_warning': '交期预警',
    'delivery_overdue': '交期逾期',
    'red_light': '红灯停滞',
};
const ROLE_LABELS = { admin: '主管', sales: '业务员', viewer: '查看者' };

let currentAuditPage = 1;
let totalAuditPages = 1;

// ===== 加载设置 =====
async function loadSettings() {
    try {
        const res = await fetch('/tracking/api/admin/settings', { credentials: 'same-origin' });
        const data = await res.json();
        if (data.success && data.data.notification_visible_days) {
            document.getElementById('settingVisibleDays').value = data.data.notification_visible_days.value;
        }
    } catch (e) { console.error('加载设置失败:', e); }
}

async function saveVisibleDays() {
    const days = document.getElementById('settingVisibleDays').value.trim();
    if (!days || isNaN(days) || parseInt(days) < 1 || parseInt(days) > 365) {
        alert('天数须在 1-365 之间');
        return;
    }
    try {
        const res = await fetch('/tracking/api/admin/settings', {
            method: 'PUT',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key: 'notification_visible_days', value: days })
        });
        const data = await res.json();
        if (data.success) {
            if (typeof showToast === 'function') showToast('成功', '通知保留天数已更新为 ' + days + ' 天', 'success');
            else alert('已保存');
        } else {
            alert(data.error || '保存失败');
        }
    } catch (e) { alert('网络错误'); }
}

// ===== 加载用户下拉框 =====
async function loadAuditUsers() {
    try {
        const res = await fetch('/tracking/api/admin/notification-users', { credentials: 'same-origin' });
        const data = await res.json();
        if (data.success) {
            const sel = document.getElementById('auditUserFilter');
            data.data.forEach(u => {
                const opt = document.createElement('option');
                opt.value = u.id;
                opt.textContent = `${u.name} (${ROLE_LABELS[u.role] || u.role})`;
                sel.appendChild(opt);
            });
        }
    } catch (e) { console.error('加载用户列表失败:', e); }
}

// ===== 加载通知记录 =====
async function loadAuditNotifications(page, silent) {
    page = page || 1;
    currentAuditPage = page;

    const params = new URLSearchParams({ page, page_size: 30 });
    const userId = document.getElementById('auditUserFilter').value;
    const ntype = document.getElementById('auditTypeFilter').value;
    const readStatus = document.getElementById('auditReadFilter').value;
    const keyword = document.getElementById('auditKeyword').value.trim();
    const dateFrom = document.getElementById('auditDateFrom').value;
    const dateTo = document.getElementById('auditDateTo').value;

    if (userId) params.set('user_id', userId);
    if (ntype) params.set('type', ntype);
    if (readStatus) params.set('read_status', readStatus);
    if (keyword) params.set('keyword', keyword);
    if (dateFrom) params.set('date_from', dateFrom);
    if (dateTo) params.set('date_to', dateTo);

    try {
        const res = await fetch('/tracking/api/admin/notifications?' + params.toString(), { credentials: 'same-origin' });
        const data = await res.json();
        if (!data.success) { alert(data.error || '查询失败'); return; }

        document.getElementById('auditTotalCount').textContent = data.total;
        totalAuditPages = data.total_pages || 1;

        const tbody = document.getElementById('auditTableBody');
        if (data.data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="empty-state"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg><div>暂无通知记录</div></td></tr>';
        } else {
            tbody.innerHTML = data.data.map(n => {
                const typeLabel = TYPE_LABELS[n.type] || n.type;
                const typeClass = n.type;
                const roleLabel = ROLE_LABELS[n.user_role] || n.user_role;
                const roleClass = n.user_role;
                const readBadge = n.is_read
                    ? `<span class="read-badge read">✓ 已读</span>`
                    : `<span class="read-badge unread">● 未读</span>`;
                const readTime = n.read_at ? formatTime(n.read_at) : '-';
                return `<tr>
                    <td style="white-space:nowrap;">${formatTime(n.created_at)}</td>
                    <td style="white-space:nowrap;">${escHtml(n.user_name)}<span class="user-role-tag ${roleClass}">${roleLabel}</span></td>
                    <td><span class="notif-type-tag ${typeClass}">${typeLabel}</span></td>
                    <td>${escHtml(n.title)}</td>
                    <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escHtml(n.message)}">${escHtml(n.message)}</td>
                    <td>${n.order_number || '-'}</td>
                    <td>${n.workflow_number || '-'}</td>
                    <td>${readBadge}</td>
                    <td style="white-space:nowrap;">${readTime}</td>
                </tr>`;
            }).join('');
        }

        // 分页
        document.getElementById('auditPageInfo').textContent = `第 ${page} / ${totalAuditPages} 页`;
        document.getElementById('auditPrevBtn').disabled = (page <= 1);
        document.getElementById('auditNextBtn').disabled = (page >= totalAuditPages);

        // 更新刷新时间
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('auditLastRefresh').textContent = `上次刷新 ${hh}:${mm}:${ss}（每 10 秒自动）`;
    } catch (e) {
        console.error('查询通知记录失败:', e);
    }
}

function resetAuditFilters() {
    document.getElementById('auditUserFilter').value = '';
    document.getElementById('auditTypeFilter').value = '';
    document.getElementById('auditReadFilter').value = '';
    document.getElementById('auditKeyword').value = '';
    document.getElementById('auditDateFrom').value = '';
    document.getElementById('auditDateTo').value = '';
    loadAuditNotifications(1);
}

function formatTime(ts) {
    if (!ts) return '-';
    const d = new Date(ts.replace(' ', 'T'));
    if (isNaN(d)) return ts;
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function escHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// 回车搜索
document.getElementById('auditKeyword').addEventListener('keydown', e => {
    if (e.key === 'Enter') loadAuditNotifications(1);
});

// 自动刷新（每 10 秒静默更新当前页，不闪烁）
let auditAutoRefreshTimer = null;
function startAutoRefresh() {
    if (auditAutoRefreshTimer) clearInterval(auditAutoRefreshTimer);
    auditAutoRefreshTimer = setInterval(() => {
        loadAuditNotifications(currentAuditPage, true);  // silent=true
    }, 10000);
}

// 切出页面暂停，切回恢复
document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        if (auditAutoRefreshTimer) { clearInterval(auditAutoRefreshTimer); auditAutoRefreshTimer = null; }
    } else {
        loadAuditNotifications(currentAuditPage, true);
        startAutoRefresh();
    }
});

// 初始化
loadSettings();
loadAuditUsers();
loadAuditNotifications(1);
startAutoRefresh();
</script>
{% endblock %}
