<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('tracking_bp.static', filename='css/guest.css') }}?v={{ STATIC_VER }}">
    <script>try { if (!localStorage.getItem('tracking_ui_language')) localStorage.setItem('tracking_ui_language', 'es'); } catch (_) {}</script>
    <script src="{{ url_for('tracking_bp.static', filename='js/ui_i18n.js') }}?v={{ STATIC_VER }}"></script>
    <script src="{{ url_for('tracking_bp.static', filename='js/theme.js') }}?v={{ STATIC_VER }}"></script>
</head>
<body>
<div class="guest-error-tools">
    <button type="button" class="guest-lang-toggle" data-lang-toggle data-lang-display="current" onclick="toggleTrackingLanguage()">ES</button>
    <button type="button" class="guest-theme-toggle" data-theme-toggle onclick="toggleTrackingTheme()">
        <span class="theme-icon-stack" aria-hidden="true">
            <svg class="theme-svg theme-svg-moon" data-theme-icon-moon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.2 15.2A8.5 8.5 0 0 1 8.8 3.8a8.6 8.6 0 1 0 11.4 11.4Z"></path></svg>
            <svg class="theme-svg theme-svg-sun" data-theme-icon-sun viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.8"></circle><path d="M12 2.2v2.1M12 19.7v2.1M4.3 12H2.2M21.8 12h-2.1M5.1 5.1l1.5 1.5M17.4 17.4l1.5 1.5M18.9 5.1l-1.5 1.5M6.6 17.4l-1.5 1.5"></path></svg>
        </span>
    </button>
</div>
<div class="guest-error">
    <div class="guest-error-card">
        <div class="guest-error-mark">!</div>
        <h1 data-i18n="guest.error.{{ error_state or 'not_found' }}.title">{{ title }}</h1>
        <p data-i18n="guest.error.{{ error_state or 'not_found' }}.subtitle">{{ subtitle }}</p>
    </div>
</div>
</body>
</html>
