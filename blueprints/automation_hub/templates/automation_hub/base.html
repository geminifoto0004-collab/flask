{% extends 'admin/base.html' %}
{% block title %}自動化中心{% endblock %}
{% block breadcrumb %}自動化中心 / Telegram Bots{% endblock %}
{% block extra_css %}
<style>
.automation-wrap{padding:28px;max-width:1400px}.automation-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.automation-title{font-size:27px;font-weight:800;color:#172033}.automation-sub{color:#697386;margin-top:5px}.automation-card{background:#fff;border:1px solid #e5e9f2;border-radius:16px;box-shadow:0 8px 30px rgba(23,32,51,.05);padding:20px;margin-bottom:20px}.automation-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.automation-stat{padding:18px;border-radius:14px;background:#f8fafc;border:1px solid #e8edf5}.automation-stat b{display:block;font-size:24px;margin-top:5px}.muted{color:#697386}.hub-form label{display:block;font-size:13px;font-weight:700;margin:0 0 6px}.hub-form input,.hub-form select{width:100%;height:42px;border:1px solid #ccd4e0;border-radius:10px;padding:0 12px;background:#fff}.hub-formgrid{display:grid;grid-template-columns:1.1fr 1.4fr 1fr 2fr auto;gap:12px;align-items:end}.hub-btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;background:#667eea;color:#fff}.hub-secondary{background:#eef3fb;color:#24324a}.hub-danger{background:#fce8e8;color:#9b1c1c}.good{color:#087f5b}.bad{color:#c92a2a}.hub-table{width:100%;border-collapse:collapse}.hub-table th,.hub-table td{text-align:left;padding:13px 10px;border-bottom:1px solid #edf0f5;vertical-align:middle}.hub-table th{font-size:12px;color:#667085;text-transform:uppercase;letter-spacing:.04em}.hub-table td{font-size:14px}.hub-badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#eef3fb}.hub-on{background:#e7f7ef;color:#087f5b}.hub-off{background:#f1f3f5;color:#697386}.hub-actions{display:flex;gap:6px;flex-wrap:wrap}.hub-actions form{margin:0}.hub-notice{padding:12px 14px;border-radius:10px;background:#eef6ff;color:#174ea6;margin-bottom:16px}.hub-warn{background:#fff4e5;color:#9a5b00}.plugin-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.plugin-card{border:1px solid #e6eaf1;border-radius:13px;padding:16px;background:#fbfcff;display:flex;justify-content:space-between;align-items:center;gap:12px}.plugin-name{font-weight:800;font-size:16px}.plugin-key{font-size:12px;color:#697386;margin-top:4px}
@media(max-width:1000px){.automation-grid{grid-template-columns:1fr 1fr}.hub-formgrid,.plugin-grid{grid-template-columns:1fr 1fr}}@media(max-width:700px){.automation-wrap{padding:16px}.automation-grid,.hub-formgrid,.plugin-grid{grid-template-columns:1fr}.automation-top{align-items:flex-start;flex-direction:column}.hub-table{display:block;overflow-x:auto}}
</style>
{% endblock %}
{% block content %}
<div class="automation-wrap">{% block body %}{% endblock %}</div>
{% endblock %}
