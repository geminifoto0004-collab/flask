<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Automation Hub{% endblock %}</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}
*{box-sizing:border-box}body{margin:0;background:#f5f7fb}.wrap{max-width:1180px;margin:0 auto;padding:28px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-size:22px;font-weight:800}.muted{color:#697386}
.card{background:#fff;border:1px solid #e5e9f2;border-radius:16px;box-shadow:0 8px 30px rgba(23,32,51,.05);padding:20px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat{padding:18px;border-radius:14px;background:#f8fafc;border:1px solid #e8edf5}.stat b{display:block;font-size:24px;margin-top:5px}
label{display:block;font-size:13px;font-weight:700;margin:0 0 6px}input,select{width:100%;height:42px;border:1px solid #ccd4e0;border-radius:10px;padding:0 12px;background:#fff}
.formgrid{display:grid;grid-template-columns:1.1fr 1.4fr 1fr 2fr auto;gap:12px;align-items:end}
button,.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;background:#1f6feb;color:#fff}.secondary{background:#eef3fb;color:#24324a}.danger{background:#fce8e8;color:#9b1c1c}.good{color:#087f5b}.bad{color:#c92a2a}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #edf0f5;vertical-align:middle}th{font-size:12px;color:#667085;text-transform:uppercase;letter-spacing:.04em}td{font-size:14px}
.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#eef3fb}.on{background:#e7f7ef;color:#087f5b}.off{background:#f1f3f5;color:#697386}
.actions{display:flex;gap:6px;flex-wrap:wrap}.actions form{margin:0}.notice{padding:12px 14px;border-radius:10px;background:#eef6ff;color:#174ea6;margin-bottom:16px}.warn{background:#fff4e5;color:#9a5b00}
@media(max-width:900px){.grid,.formgrid{grid-template-columns:1fr 1fr}.wrap{padding:16px}}@media(max-width:620px){.grid,.formgrid{grid-template-columns:1fr}table{display:block;overflow-x:auto}}
</style>
</head>
<body><div class="wrap">{% block body %}{% endblock %}</div></body>
</html>
