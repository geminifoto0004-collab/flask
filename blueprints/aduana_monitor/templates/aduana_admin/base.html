<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Aduana Monitor{% endblock %}</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--text:#152033;--muted:#6b7890;--line:#e5eaf1;--brand:#5368ee;--brand2:#7356c8;--good:#15803d;--warn:#a16207;--bad:#b42318;--soft:#eef2ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1180px;margin:0 auto;padding:30px 22px 60px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:24px}.title h1{font-size:28px;margin:0 0 5px}.title p{margin:0;color:var(--muted)}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn,.nav a{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--text);padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:650;font-size:14px;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0}.btn.danger{color:var(--bad);background:#fff}.btn.small{padding:7px 10px;font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0 28px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 4px 18px rgba(40,52,90,.04)}.stat .n{font-size:28px;font-weight:800;margin-top:6px}.stat .k{color:var(--muted);font-size:13px;font-weight:650}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 18px rgba(40,52,90,.04);margin-bottom:20px;overflow:hidden}.panel-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px}.panel-head h2{font-size:18px;margin:0}.panel-body{padding:18px 20px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:13px 14px;border-bottom:1px solid var(--line);font-size:14px;text-align:left;vertical-align:middle}th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#fbfcfe}tr:last-child td{border-bottom:0}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:750}.active{background:#e9f8ef;color:var(--good)}.pending{background:#fff6dd;color:var(--warn)}.disabled,.rejected,.failed{background:#fff0ef;color:var(--bad)}.owner{background:#ecebff;color:#5b4bc4}.success,.sent{background:#e9f8ef;color:var(--good)}.partial,.running{background:#fff6dd;color:var(--warn)}.muted{color:var(--muted)}.pending-card{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}.pending-card:last-child{margin-bottom:0}.pending-main strong{font-size:16px}.pending-meta{color:var(--muted);font-size:13px;margin-top:4px}.approval{display:flex;gap:8px;align-items:center;flex-wrap:wrap}select,input[type=number],input[type=password]{border:1px solid #ccd5e1;background:#fff;border-radius:9px;padding:9px 10px;color:var(--text);font-size:14px}.check{display:inline-flex;align-items:center;gap:5px;font-size:13px}.user-name{font-weight:700}.sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}.config-strip{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fafbff;border-radius:999px;padding:7px 10px;font-size:12px;color:var(--muted)}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{margin-bottom:14px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}.field input,.field select{width:100%}.monitor{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}.monitor:last-child{border-bottom:0}.empty{padding:24px;color:var(--muted);text-align:center}.login-wrap{max-width:390px;margin:11vh auto 0;padding:20px}.login-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 14px 45px rgba(26,38,74,.1)}.login-card h1{margin:0 0 6px;font-size:24px}.login-card p{color:var(--muted);margin:0 0 22px}.login-card input{width:100%;padding:12px;margin-bottom:12px}.login-card .btn{width:100%;padding:12px}.error{background:#fff0ef;color:var(--bad);padding:10px 12px;border-radius:9px;margin-bottom:12px;font-size:13px}@media(max-width:850px){.cards{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.pending-card{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}}@media(max-width:520px){.cards{grid-template-columns:1fr 1fr}.shell{padding:20px 12px}.stat{padding:14px}.stat .n{font-size:24px}}
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
