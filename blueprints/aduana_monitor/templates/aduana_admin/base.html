{% extends 'admin/base.html' %}
{% block title %}Aduana Monitor{% endblock %}
{% block breadcrumb %}自動化中心 / Aduana Monitor{% endblock %}
{% block extra_css %}
<style>
.aduana-shell{--panel:#fff;--text:#152033;--muted:#6b7890;--line:#e5eaf1;--brand:#5368ee;--brand2:#7356c8;--good:#15803d;--warn:#a16207;--bad:#b42318;--soft:#eef2ff;color:var(--text);padding:28px;max-width:1400px}
.aduana-shell *{box-sizing:border-box}.aduana-shell .shell{max-width:1180px;margin:0;padding:0 0 40px}.aduana-shell .top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:24px}.aduana-shell .title h1{font-size:28px;margin:0 0 5px}.aduana-shell .title p{margin:0;color:var(--muted)}.aduana-shell .nav{display:flex;gap:8px;flex-wrap:wrap}.aduana-shell .btn,.aduana-shell .nav a{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--text);padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:650;font-size:14px;cursor:pointer}.aduana-shell .btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0}.aduana-shell .btn.danger{color:var(--bad);background:#fff}.aduana-shell .btn.small{padding:7px 10px;font-size:13px}.aduana-shell .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0 28px}.aduana-shell .stat{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 4px 18px rgba(40,52,90,.04)}.aduana-shell .stat .n{font-size:28px;font-weight:800;margin-top:6px}.aduana-shell .stat .k{color:var(--muted);font-size:13px;font-weight:650}.aduana-shell .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 18px rgba(40,52,90,.04);margin-bottom:20px;overflow:hidden}.aduana-shell .panel-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px}.aduana-shell .panel-head h2{font-size:18px;margin:0}.aduana-shell .panel-body{padding:18px 20px}.aduana-shell .table-wrap{overflow:auto}.aduana-shell table{width:100%;border-collapse:collapse;min-width:760px}.aduana-shell th,.aduana-shell td{padding:13px 14px;border-bottom:1px solid var(--line);font-size:14px;text-align:left;vertical-align:middle}.aduana-shell th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#fbfcfe}.aduana-shell tr:last-child td{border-bottom:0}.aduana-shell .badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:750}.aduana-shell .active{background:#e9f8ef;color:var(--good)}.aduana-shell .pending{background:#fff6dd;color:var(--warn)}.aduana-shell .disabled,.aduana-shell .rejected,.aduana-shell .failed{background:#fff0ef;color:var(--bad)}.aduana-shell .owner{background:#ecebff;color:#5b4bc4}.aduana-shell .success,.aduana-shell .sent{background:#e9f8ef;color:var(--good)}.aduana-shell .partial,.aduana-shell .running{background:#fff6dd;color:var(--warn)}.aduana-shell .muted{color:var(--muted)}.aduana-shell .pending-card{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}.aduana-shell .pending-card:last-child{margin-bottom:0}.aduana-shell .pending-main strong{font-size:16px}.aduana-shell .pending-meta{color:var(--muted);font-size:13px;margin-top:4px}.aduana-shell .approval{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.aduana-shell select,.aduana-shell input[type=number],.aduana-shell input[type=password]{border:1px solid #ccd5e1;background:#fff;border-radius:9px;padding:9px 10px;color:var(--text);font-size:14px}.aduana-shell .check{display:inline-flex;align-items:center;gap:5px;font-size:13px}.aduana-shell .user-name{font-weight:700}.aduana-shell .sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}.aduana-shell .config-strip{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.aduana-shell .chip{border:1px solid var(--line);background:#fafbff;border-radius:999px;padding:7px 10px;font-size:12px;color:var(--muted)}.aduana-shell .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.aduana-shell .field{margin-bottom:14px}.aduana-shell .field label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}.aduana-shell .field input,.aduana-shell .field select{width:100%}.aduana-shell .monitor{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}.aduana-shell .monitor:last-child{border-bottom:0}.aduana-shell .empty{padding:24px;color:var(--muted);text-align:center}
@media(max-width:850px){.aduana-shell{padding:18px}.aduana-shell .cards{grid-template-columns:1fr 1fr}.aduana-shell .top{align-items:flex-start;flex-direction:column}.aduana-shell .pending-card{grid-template-columns:1fr}.aduana-shell .detail-grid{grid-template-columns:1fr}}@media(max-width:520px){.aduana-shell{padding:12px}.aduana-shell .cards{grid-template-columns:1fr 1fr}.aduana-shell .stat{padding:14px}.aduana-shell .stat .n{font-size:24px}}
</style>
{% endblock %}
{% block content %}
<div class="aduana-shell">{% block body %}{% endblock %}</div>
{% endblock %}
