{% set pdf_images = order.images | selectattr('media_type', 'equalto', 'pdf_page') | list %}
{% if pdf_images or order.documents %}
<section class="guest-panel pdf-documents" data-pdf-documents data-pdf-json="{{ pdf_images|tojson|forceescape }}" data-pdf-metadata="{{ (order.documents or [])|tojson|forceescape }}">
<h2>Documentos</h2><div class="pdf-document-layout"><div data-pdf-list></div><div data-pdf-stage><p>Seleccione un documento para ver sus páginas.</p></div></div>
</section>
{% endif %}
