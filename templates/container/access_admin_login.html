<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container Access Admin</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
            margin: 0;
            padding: 40px 16px;
        }
        .card {
            max-width: 420px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
            padding: 24px;
            border: 1px solid #e5e7eb;
        }
        h1 {
            font-size: 20px;
            margin: 0 0 12px;
        }
        label {
            display: block;
            font-size: 12px;
            margin-bottom: 6px;
            color: #4b5563;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 14px;
        }
        button {
            width: 100%;
            padding: 10px 12px;
            border: none;
            background: #2563eb;
            color: #ffffff;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }
        .error {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            padding: 8px 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Container Access Admin</h1>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post" action="/container/access-admin/login">
            <label for="password">Admin Password</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>
