<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión de Usuario - Sistema de Autorización Xingwang</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/user.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🔐 Inicio de Sesión del Sistema</h1>
            <p>Sistema de Gestión de Autorización Xingwang</p>
        </div>

        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="email">Dirección de Correo Electrónico</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Por favor ingrese su dirección de correo electrónico"
                    required 
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-group">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Por favor ingrese su contraseña"
                        required
                    >
                    <button type="button" class="toggle-password" onclick="togglePassword('password')">
                        <i class="icon">👁️</i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login">
                Iniciar Sesión
            </button>
        </form>

        <div class="auth-links">
            <a href="/user/forgot-password">¿Olvidó su contraseña?</a>
            <span>|</span>
            <a href="/user/register">Registrar Cuenta de Usuario</a>
        </div>

        <div class="footer">
            © 2025 Xingwang Textiles - Sistema de Gestión de Autorización
        </div>
    </div>

    <script>
    // 密碼顯示/隱藏功能
    function togglePassword(inputId) {
        const input = document.getElementById(inputId);
        const button = input.nextElementSibling;
        const icon = button.querySelector('.icon');
        
        if (input.type === 'password') {
            input.type = 'text';
            icon.textContent = '🙈';
        } else {
            input.type = 'password';
            icon.textContent = '👁️';
        }
    }
    </script>

    <style>
    .input-group {
        position: relative;
        display: flex;
        align-items: center;
    }
    
    .input-group input {
        width: 100%;
        padding-right: 3rem;
    }
    
    .toggle-password {
        position: absolute;
        right: 0.75rem;
        background: none;
        border: none;
        cursor: pointer;
        padding: 0.5rem;
        border-radius: 4px;
        transition: background-color 0.2s;
    }
    
    .toggle-password:hover {
        background-color: #f3f4f6;
    }
    
    @media (max-width: 768px) {
        .input-group input {
            padding-right: 2.5rem;
        }
        
        .toggle-password {
            right: 0.5rem;
            padding: 0.4rem;
        }
    }
    </style>
</body>
</html>
