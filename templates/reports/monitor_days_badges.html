{# Tiny SVG badges for the WEB report only. Telegram snapshot keeps its existing HTML. #}
{% macro total(days) -%}
<span class="ft-total" title="免用箱總天數：{{ days }} 天" aria-label="免用箱總天數 {{ days }} 天">
  <svg class="ft-svg" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>
  </svg><span>{{ days }}</span>
</span>
{%- endmacro %}
{% macro remaining(value, ship=false) -%}
{% if value is not none -%}
<span class="ft-remaining {{ 'ft-ship' if ship else '' }} {{ 'ft-danger' if value <= 0 else ('ft-soon' if value <= 4 else 'ft-safe') }}"
 title="{{ '已逾期 ' ~ (-value) ~ ' 天' if value < 0 else ('今天到期' if value == 0 else '剩餘 ' ~ value ~ ' 天') }} · ETA 參考計算"
 aria-label="{{ '逾期 ' ~ (-value) ~ ' 天' if value < 0 else ('今天到期' if value == 0 else '剩餘 ' ~ value ~ ' 天') }}">
  <svg class="ft-svg" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M5 3h14M5 21h14M7 3c0 6 5 6 5 9s-5 3-5 9M17 3c0 6-5 6-5 9s5 3 5 9"/>
  </svg><span>{{ value }}</span>
</span>
{%- endif %}
{%- endmacro %}
