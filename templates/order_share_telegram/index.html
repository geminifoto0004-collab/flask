<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>XINGWANG · 客戶分享</title>
  <style>
  :root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;--bg:var(--tg-theme-bg-color,#f6f7fa);--panel:var(--tg-theme-secondary-bg-color,#fff);--fg:var(--tg-theme-text-color,#1b2430);--hint:var(--tg-theme-hint-color,#7e8794);--accent:var(--tg-theme-link-color,#1767c1);--border:rgba(127,137,148,.2)}
  *{box-sizing:border-box}body{margin:0;color:var(--fg);background:var(--bg);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .shell{max-width:850px;margin:auto;padding:18px 16px 26px}
  header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:2px 0 20px}
  header h1{font-size:19px;letter-spacing:.2px;margin:0 0 4px;font-weight:740}
  header p{font-size:12px;margin:0;color:var(--hint)}
  button{cursor:pointer;font:inherit;touch-action:manipulation}
  .refresh{border:1px solid var(--border);border-radius:11px;padding:10px 13px;background:var(--panel);color:var(--fg);white-space:nowrap}
  .search{position:sticky;top:0;z-index:2;padding:8px 0 15px;background:var(--bg)}
  input{width:100%;border:1px solid var(--border);border-radius:13px;padding:14px 16px;font-size:16px;background:var(--panel);color:var(--fg);outline:none}
  input:focus{border-color:var(--accent)}
  .meta{font-size:12px;color:var(--hint);margin:0 2px 12px;display:flex;justify-content:space-between}
  .list{background:var(--panel);border-radius:14px;overflow:hidden;border:1px solid var(--border)}
  .item{display:flex;align-items:center;gap:12px;padding:12px 13px;border-bottom:1px solid var(--border);min-height:64px}
  .item:last-child{border-bottom:0}
  .number{min-width:23px;text-align:right;color:var(--hint);font-size:12px;align-self:center}
  .details{flex:1;min-width:0}
  .name{display:block;color:var(--accent);font-size:14px;font-weight:630;line-height:1.4;word-break:break-word;text-decoration:none}
  .name:active{text-decoration:underline}
  .expiry{color:var(--hint);font-size:11px;margin-top:4px}
  .copy{background:var(--bg);border:1px solid var(--border);color:var(--fg);border-radius:10px;padding:10px 11px;min-width:67px;min-height:42px;font-size:12px;flex:none}
  .copy:focus-visible{outline:2px solid var(--accent)}
  .status{margin:48px 8px 0;text-align:center;color:var(--hint);line-height:1.7;font-size:14px}
  .status[hidden],.list[hidden]{display:none}
  .toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:11px 18px;border-radius:16px;background:var(--fg);color:var(--bg);font-size:13px;box-shadow:0 5px 20px #0002;white-space:nowrap;max-width:90%;z-index:5}
  .toast[hidden]{display:none}
  </style>
  {% if not china %}<script src="https://telegram.org/js/telegram-web-app.js"></script>{% endif %}
  <script src="{{ '/cn/order-links/app.js' if china else '/telegram/order-shares/app.js' }}" defer></script>
</head>
<body>
  <main class="shell">
    <header>
      <div><h1>📋 XINGWANG 客戶分享</h1><p>只顯示目前有效的客戶連結</p></div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="refresh" id="refresh" type="button">↻ 更新</button>
        {% if china %}<form action="/cn/order-links/logout" method="post" style="margin:0">
          <input type="hidden" name="csrf" value="{{ logout_csrf }}">
          <button class="refresh" type="submit">退出</button></form>{% endif %}
      </div>
    </header>
    <div class="search"><input id="search" type="search" autocomplete="off" placeholder="輸入客戶名稱，例如 SERGIO" aria-label="搜尋客戶名稱"></div>
    <div class="meta"><span id="count">讀取中…</span><span>點姓名開啟 · 點複製取網址</span></div>
    <section id="list" class="list" hidden aria-label="有效客戶連結"></section>
    <div id="status" class="status" role="status">{{ '正在載入客戶資料…' if china else '正在確認 Telegram 身分…' }}</div>
  </main>
  <div id="toast" class="toast" hidden role="status"></div>
</body>
</html>
