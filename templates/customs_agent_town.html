<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CUSTOMS AGENT TOWN</title>
  <style>html,body{margin:0;min-height:100%;background:#11161f}body{padding:18px;box-sizing:border-box}</style>
</head>
<body>
<div id="customs-sim" class="app-root">
  <div class="hud">
    <div class="hud-left">
      <strong>⚓ CUSTOMS AGENT TOWN</strong>
      <span id="statusText">關員自由活動中</span>
    </div>
    <div class="hud-stats">
      <span>已找到 <b id="foundCount">0</b></span>
      <span>未找到 <b id="notFoundCount">0</b></span>
      <span>扣留 <b id="holdCount">0</b></span>
      <span>總船數 <b id="totalCount">0</b></span>
    </div>
  </div>

  <div class="result-strip" aria-label="船隻查驗結果">
    <div class="result-label">通過</div>
    <div class="result-lights" id="passedLights"></div>
    <div class="result-label hold-label">待重查</div>
    <div class="result-lights hold-lights" id="heldLights"></div>
  </div>

  <div class="game-wrap">
    <canvas id="game" width="640" height="400" aria-label="CUSTOMS AGENT TOWN 動態像素海關小鎮"></canvas>
  </div>

  <div class="controls">
    <button id="startBtn" type="button">🚢 船抵港：開始一批</button>
    <button id="addBtn" type="button">＋ 再來一艘船</button>
    <button id="finishBtn" type="button">✓ 快速完成</button>
    <button id="aiTestBtn" type="button">🧠 AI 小鎮想一下</button>
    <input id="aiBaseInput" type="text" placeholder="貼 Render 服務網址或 /api/town/think" aria-label="Render AI 網址">
    <button id="aiSaveBtn" type="button">保存 AI 網址</button>
    <button id="resetBtn" type="button">↺ 重置</button>
    <label>速度
      <select id="speedSelect">
        <option value="0.6">慢</option>
        <option value="1" selected>正常</option>
        <option value="1.7">快</option>
      </select>
    </label>
  </div>

  <div class="event-log" id="eventLog" aria-live="polite"></div>
</div>

<style>
#customs-sim.app-root{
  background:light-dark(#e7e2d5,#11161f);
  color:light-dark(#26231f,#eef2f7);
  border-radius:0;
  padding:18px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
#customs-sim .hud{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
#customs-sim .hud-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#customs-sim .hud-left strong{letter-spacing:.05em}
#customs-sim #statusText{font-size:13px;opacity:.72}
#customs-sim .hud-stats{display:flex;gap:14px;font-size:13px;flex-wrap:wrap}
#customs-sim .result-strip{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:8px;align-items:center;margin-bottom:10px;padding:7px 9px;border:2px solid light-dark(#b6ad9e,#303949);background:light-dark(#f3eee4,#171e29);font-size:11px}
#customs-sim .result-label{font-weight:800;color:#3f7f4f}.result-label.hold-label{color:#a56c2d}
#customs-sim .result-lights{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
#customs-sim .result-lamp{width:12px;height:8px;border:2px solid #2e5f38;background:#5fbd70;box-shadow:0 0 0 1px rgba(255,255,255,.08) inset}
#customs-sim .result-lamp.hold{border-color:#8a5e27;background:#d7a84d;animation:holdPulse 1s steps(2,end) infinite}
@keyframes holdPulse{50%{filter:brightness(1.5)}}
#customs-sim .game-wrap{background:#090d13;padding:8px;border:3px solid #080a0d;box-shadow:0 0 0 3px light-dark(#696153,#344052);overflow:hidden}
#customs-sim canvas{display:block;width:100%;height:auto;aspect-ratio:8/5;image-rendering:pixelated;image-rendering:crisp-edges;background:#173344}
#customs-sim .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
#customs-sim button,#customs-sim select{min-height:44px;border:2px solid light-dark(#655d50,#3c4657);background:light-dark(#f4efe3,#202936);color:inherit;padding:8px 12px;font:inherit;font-weight:700;cursor:pointer}
#customs-sim input{min-height:44px;min-width:240px;border:2px solid light-dark(#655d50,#3c4657);background:light-dark(#fffaf0,#202936);color:inherit;padding:8px 10px;font:inherit}
#customs-sim button:focus-visible,#customs-sim select:focus-visible{outline:3px solid #e4aa3e;outline-offset:2px}
#customs-sim label{display:flex;align-items:center;gap:7px;font-size:13px}
#customs-sim .event-log{margin-top:12px;min-height:48px;border:2px solid light-dark(#b6ad9e,#303949);padding:9px 11px;font-size:12px;line-height:1.55;background:light-dark(#f3eee4,#171e29);max-height:110px;overflow:auto}
@media(max-width:600px){#customs-sim.app-root{padding:10px}#customs-sim .controls>*{flex:1 1 100%}#customs-sim .hud{align-items:flex-start}}
</style>

<script>
(() => {
  const root=document.getElementById('customs-sim');
  if(root.dataset.ready) return;
  root.dataset.ready='1';

  const canvas=root.querySelector('#game');
  const ctx=canvas.getContext('2d');
  ctx.imageSmoothingEnabled=false;
  const W=canvas.width,H=canvas.height;

  const ui={
    status:root.querySelector('#statusText'), found:root.querySelector('#foundCount'),
    notFound:root.querySelector('#notFoundCount'), hold:root.querySelector('#holdCount'), total:root.querySelector('#totalCount'), log:root.querySelector('#eventLog'),
    passedLights:root.querySelector('#passedLights'), heldLights:root.querySelector('#heldLights'),
    start:root.querySelector('#startBtn'), add:root.querySelector('#addBtn'), finish:root.querySelector('#finishBtn'), aiTest:root.querySelector('#aiTestBtn'), aiBase:root.querySelector('#aiBaseInput'), aiSave:root.querySelector('#aiSaveBtn'), reset:root.querySelector('#resetBtn'), speed:root.querySelector('#speedSelect')
  };

  const P={ink:'#17202a',outline:'#0e151d',wall:'#d8cfb2',wall2:'#8b806d',floor:'#d8b77f',floor2:'#c79b61',sky:'#a8d9e8',sea:'#4c96ad',sea2:'#357b93',glass:'#d7edf0',desk:'#956a45',desk2:'#67462e',skin:'#d9a27b',hair:'#4e372c',uniform:'#f2eee0',navy:'#345a79',gold:'#e6be53',green:'#58bd70',red:'#d86161',paper:'#eee6cc',ship:'#405a67',ship2:'#a85d53',grass:'#91c97a',grass2:'#78b566',path:'#e7d49a',plant:'#5c9555'};
  let last=performance.now(),running=true,speed=1,t=0;
  let queue=[],retryQueue=[],done=0,total=0,nextNum=2048,celebrate=0,retryCountdown=0;
  let saveAccum=0;
  let vessels=[];
  const checkpoint={x:320,y:338};
  const officeExit={x:320,y:280};
  const inspectionSpot={x:300,y:294};
  const deskBlocks=[
    {x1:82,y1:148,x2:182,y2:218},
    {x1:222,y1:148,x2:322,y2:218},
    {x1:362,y1:148,x2:462,y2:218}
  ];
  const agents=[
    makeAgent('MIA',132,244,0),
    makeAgent('ANA',272,244,1),
    makeAgent('LIA',412,244,2)
  ];
  const plantSlots=[
    // 盆栽只生成在新辦公室佈局的空地，避開檔案牆、茶水區、桌子與走道。
    {x:58,y:236},{x:202,y:242},{x:338,y:242},{x:474,y:242},{x:574,y:236},
    {x:198,y:112},{x:392,y:112},{x:544,y:122},{x:486,y:124},{x:210,y:128}
  ];
  let plantStates=[];
  const flowerColors=['#e56f78','#8e79d6','#e8c45c','#d887d8','#ef8663','#72b9d6'];
  let dogVisitors=[];
  let dogPoops=[];
  let dogEventTimer=rand(70,140);
  let dogFamilyStage=0;
  let puppyDelay=0;
  const WORLD_DB='customs-agent-town-world-v1';
  const WORLD_STORE='world';
  const WORLD_KEY='main';
  function normalizeTownAiBase(value){
    let v=String(value||'').trim();
    if(!v)return '';
    if(!/^https?:\/\//i.test(v)&&/^[a-z0-9.-]+(?::\d+)?(?:\/|$)/i.test(v))v='https://'+v;
    try{
      const u=new URL(v);
      const host=(u.hostname||'').toLowerCase();
      if(host==='render.com'||host==='www.render.com'||host==='dashboard.render.com')return '';
      u.pathname=u.pathname.replace(/\/(?:api\/town\/(?:think|health))\/?$/i,'').replace(/\/$/,'');
      u.search='';u.hash='';
      return u.origin+(u.pathname==='/'?'':u.pathname);
    }catch(_e){return '';}
  }
  const DEFAULT_TOWN_AI_BASE=(location.hostname||'').toLowerCase().endsWith('.onrender.com')?location.origin:'https://flask-393d.onrender.com';
  let TOWN_AI_BASE=normalizeTownAiBase(localStorage.getItem('customs-town-ai-base')||DEFAULT_TOWN_AI_BASE);
  if(!localStorage.getItem('customs-town-ai-base'))localStorage.setItem('customs-town-ai-base',TOWN_AI_BASE);
  if(ui.aiBase)ui.aiBase.value=TOWN_AI_BASE;

  function newPlant(slot,index=0){
    const bloomAt=2+Math.floor(Math.random()*4);
    const bornAt=Date.now();
    return {id:'plant-'+bornAt+'-'+index+'-'+Math.floor(Math.random()*9999),x:slot.x,y:slot.y,water:0,bloomAt,wiltAt:bloomAt+3+Math.floor(Math.random()*4),flower:pick(flowerColors),alive:true,bornAt,lastWateredAt:0,dryWiltAt:bornAt+rand(70000,150000),wiltedAt:0,vanishAt:0,respawnAt:0};
  }
  function seedPlants(){
    const slots=[...plantSlots].sort(()=>Math.random()-.5).slice(0,5);
    plantStates=slots.map((s,i)=>newPlant(s,i));
  }

  function makeAgent(name,x,y,index){
    const personas=[
      {type:'lazy',workBias:.34,energy:.58,mood:.72,curiosity:.35,social:.38,focus:.48,restlessness:.28,coffeeLove:.96,toiletLove:.18,flowerLove:.18,hair:'#3a2b26',skin:'#d9a27b',accent:'#c18a52'},
      {type:'busybody',workBias:.72,energy:.78,mood:.82,curiosity:.95,social:.92,focus:.76,restlessness:.62,coffeeLove:.32,toiletLove:.24,flowerLove:.94,hair:'#7b4f37',skin:'#d7a07a',accent:'#7b75a7'},
      {type:'restless',workBias:.52,energy:.86,mood:.68,curiosity:.66,social:.55,focus:.58,restlessness:.94,coffeeLove:.44,toiletLove:.88,flowerLove:.52,hair:'#25282c',skin:'#b98262',accent:'#4f8a77'}
    ];
    const p=personas[index]||personas[0];
    return {name,index,persona:p.type,homeX:x,homeY:y,x,y,state:'idle',idle:'wander',idleAction:'stand',task:null,bay:null,timer:rand(1.5,4),walkPhase:0,successFlash:0,lastResult:'',retryCount:0,decisionTimer:rand(.8,3.2),workBias:p.workBias,inspectStyle:'clipboard',inspectPhase:0,energy:p.energy,mood:p.mood,curiosity:p.curiosity,social:p.social,focus:p.focus,restlessness:p.restlessness,coffeeLove:p.coffeeLove,toiletLove:p.toiletLove,flowerLove:p.flowerLove,hairColor:p.hair,skinColor:p.skin,accentColor:p.accent,lifeTimer:rand(5,12),screenTimer:rand(4,12),screenMode:Math.floor(rand(0,4)),screenFlash:0,path:[],pathTarget:''};
  }
  function rand(a,b){return a+Math.random()*(b-a)}
  const FISH_SPOTS=[{x:286,y:292},{x:352,y:292}];
  agents.forEach((a,i)=>{if(typeof a.fishLove!=='number')a.fishLove=i===2?rand(.72,.98):rand(.08,.72);if(typeof a.fishCaught!=='number')a.fishCaught=0;if(typeof a.fishNibble!=='number')a.fishNibble=rand(1.5,4.5);});
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function weightedPick(items){const total=items.reduce((s,x)=>s+x[1],0);let r=Math.random()*total;for(const [value,w] of items){r-=w;if(r<=0)return value;}return items[items.length-1][0];}
  function randIdle(a){
    if(!a)return pick(['wander','wander','coffee','files','desk','plant','stretch','radio','chat','fishing']);
    return weightedPick([
      ['wander',1.1+a.restlessness*2.2],['coffee',.2+a.coffeeLove*2.2+(1-a.energy)*1.3],['files',.35+a.focus*1.1+(a.persona==='busybody'?1.4:0)],['desk',.3+a.focus*.8],['plant',.18+a.curiosity*.55+a.flowerLove*.35],['waterPlant',.10+a.flowerLove*1.7],['lookSea',.2+a.curiosity*.9],['stretch',.18+(1-a.energy)*.9],['radio',.14+(1-a.focus)*.55],['chat',.1+a.social*1.2+(a.persona==='busybody'?.9:0)],['checkCoworker',a.persona==='busybody'?2.0:.08],['fishing',.05+a.fishLove*1.45]
    ]);
  }
  function code(){return 'VSL-'+String(nextNum++);}

  function openWorldDb(){
    return new Promise((resolve,reject)=>{
      if(!('indexedDB' in window)){resolve(null);return;}
      const req=indexedDB.open(WORLD_DB,1);
      req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(WORLD_STORE))db.createObjectStore(WORLD_STORE);};
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
    });
  }
  async function saveWorld(){
    try{
      const db=await openWorldDb();if(!db)return;
      const state={savedAt:Date.now(),plants:plantStates,agents:agents.map(a=>({name:a.name,workBias:a.workBias,energy:a.energy,mood:a.mood,curiosity:a.curiosity,social:a.social,focus:a.focus,restlessness:a.restlessness,coffeeLove:a.coffeeLove,flowerLove:a.flowerLove,fishLove:a.fishLove,fishCaught:a.fishCaught,persona:a.persona}))};
      await new Promise((resolve,reject)=>{const tx=db.transaction(WORLD_STORE,'readwrite');tx.objectStore(WORLD_STORE).put(state,WORLD_KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});
      db.close();
    }catch(_e){}
  }
  async function loadWorld(){
    try{
      const db=await openWorldDb();if(!db){seedPlants();return;}
      const state=await new Promise((resolve,reject)=>{const tx=db.transaction(WORLD_STORE,'readonly');const req=tx.objectStore(WORLD_STORE).get(WORLD_KEY);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);});
      db.close();
      if(!state){seedPlants();return;}
      if(Array.isArray(state.plants)&&state.plants.length){plantStates=state.plants.map((p,i)=>{const bornAt=Number.isFinite(p.bornAt)?p.bornAt:(state.savedAt||Date.now());return {...p,bornAt,lastWateredAt:Number.isFinite(p.lastWateredAt)?p.lastWateredAt:0,dryWiltAt:Number.isFinite(p.dryWiltAt)?p.dryWiltAt:bornAt+rand(70000,150000)};});}else seedPlants();
      if(Array.isArray(state.agents)){state.agents.forEach((saved,i)=>{const a=agents[i];if(!a||!saved)return;['workBias','energy','mood','curiosity','social','focus','restlessness','coffeeLove','flowerLove','fishLove','fishCaught'].forEach(k=>{if(Number.isFinite(saved[k]))a[k]=saved[k];});});}
      const hours=Math.min(72,Math.max(0,(Date.now()-(state.savedAt||Date.now()))/3600000));
      if(hours>0){agents.forEach(a=>{a.energy=Math.max(.2,Math.min(1,a.energy+rand(-.03,.05)*Math.min(8,hours)));a.mood=Math.max(.1,Math.min(1,a.mood+rand(-.02,.03)*Math.min(8,hours)));a.workBias=Math.max(.12,Math.min(.96,a.workBias+rand(-.015,.015)*Math.min(12,hours)));});}
    }catch(_e){seedPlants();}
  }

  function chooseFreePlantSlot(excludeId=''){
    const occupied=plantStates.filter(p=>p.alive&&p.id!==excludeId);
    const free=plantSlots.filter(s=>!occupied.some(p=>Math.hypot(p.x-s.x,p.y-s.y)<26));
    return pick(free.length?free:plantSlots);
  }
  function updatePlantLife(){
    const now=Date.now();
    plantStates.forEach(p=>{
      const naturallyDry=p.alive&&!p.wiltedAt&&now>=p.dryWiltAt;
      if(p.alive&&(p.water>=p.wiltAt||naturallyDry)){
        if(!p.wiltedAt){p.wiltedAt=now;p.vanishAt=now+rand(9000,18000);}
        if(now>=p.vanishAt){p.alive=false;p.respawnAt=now+rand(10000,26000);}
      }else if(!p.alive&&now>=p.respawnAt){const slot=chooseFreePlantSlot(p.id),fresh=newPlant(slot,Math.floor(Math.random()*999));Object.assign(p,fresh,{id:p.id});}
    });
  }

  function spawnDog(kind='male',fromLeft=true){
    const palette=kind==='female'?{body:'#b98255',shade:'#8d5c3d',ear:'#5c3c2d',mark:'#e2c49a'}:kind==='puppy'?{body:pick(['#d5b07c','#8f6648','#c98d5e','#b8a08a']),shade:'#6d5140',ear:'#4f382e',mark:'#eee0c3'}:{body:'#c08a5e',shade:'#80583d',ear:'#513829',mark:'#f0d2a3'};
    dogVisitors.push({kind,palette,x:fromLeft?-24:664,y:286+rand(-5,5),vx:fromLeft?1:-1,state:'roam',timer:rand(12,24),behaviorTimer:rand(2.5,7),pauseTimer:0,phase:rand(0,8),fromLeft,targetX:fromLeft?rand(120,520):rand(100,500),targetY:pick([284,290,298]),path:[],pathTarget:'',followAgent:null,lastZone:''});
  }
  function beginDogVisit(){if(dogVisitors.length)return;spawnDog('male',Math.random()<.5);dogFamilyStage=Math.random()<.16?1:0;dogEventTimer=rand(110,220);}
  function updateDogs(dt){
    dogEventTimer-=dt;if(dogEventTimer<=0)beginDogVisit();
    if(puppyDelay>0){puppyDelay-=dt;if(puppyDelay<=0){const n=2+Math.floor(Math.random()*3);for(let i=0;i<n;i++){spawnDog('puppy',true);const p=dogVisitors[dogVisitors.length-1];p.x-=i*14;p.y=286+((i%2)*5)-2;p.timer=rand(12,20);p.targetX=650;}}}
    const activeShip=vessels.find(v=>['inbound','toBay','berthed','cleared'].includes(v.state));
    dogVisitors.forEach((d,i)=>{
      d.phase+=dt*7;d.timer-=dt;d.behaviorTimer-=dt;
      const nearestAgent=agents.reduce((best,a)=>{const dist=Math.hypot(a.x-d.x,a.y-d.y);return !best||dist<best.dist?{a,dist}:best;},null);
      if(d.pauseTimer>0){d.pauseTimer-=dt;return;}
      if(d.behaviorTimer<=0&&d.state!=='leave'){
        d.behaviorTimer=rand(4.5,11);const roll=Math.random();
        if(d.kind!=='puppy'&&activeShip&&roll<.26){d.state='chaseShip';d.followAgent=null;}
        else if(nearestAgent&&nearestAgent.dist<150&&roll<.52){d.state='followPerson';d.followAgent=nearestAgent.a;}
        else if(roll<.68){d.state='sniff';d.pauseTimer=rand(1.2,4.2);d.followAgent=null;}
        else{d.state='roam';d.followAgent=null;const roamZones=[{x:rand(62,210),y:rand(282,300),z:'leftWalk'},{x:rand(420,575),y:rand(282,300),z:'rightWalk'},{x:rand(260,380),y:rand(282,300),z:'gateWalk'},{x:rand(70,570),y:rand(286,300),z:'shore'}].filter(z=>z.z!==d.lastZone||Math.random()<.25);const z=pick(roamZones);d.targetX=z.x;d.targetY=z.y;d.lastZone=z.z;}
      }
      if(d.state==='chaseShip'&&activeShip){d.targetX=Math.max(60,Math.min(580,activeShip.x));d.targetY=294;if(activeShip.state==='berthed'||activeShip.state==='hold'||d.behaviorTimer<=.2){d.state='roam';d.behaviorTimer=rand(2,5);}}
      if(d.state==='followPerson'&&d.followAgent){const fa=d.followAgent;d.targetX=fa.x+(fa.x>=d.x?-16:16);d.targetY=fa.y+16;if(Math.hypot(fa.x-d.x,fa.y-d.y)<26){d.pauseTimer=rand(.5,1.8);}if(Math.hypot(fa.x-d.x,fa.y-d.y)>170||d.behaviorTimer<=.2){d.state='roam';d.followAgent=null;d.behaviorTimer=rand(2,5);}}
      const spd=(d.kind==='puppy'?26:34)*dt;const arrived=dogMoveToward(d,d.targetX,d.targetY,spd);
      if(arrived&&d.kind==='puppy'){d.targetX=670;d.targetY=286+rand(-5,5);}
      else if(arrived&&d.timer>0){d.state='sniff';d.pauseTimer=rand(.8,3.2);d.behaviorTimer=rand(2.5,7);const z=pick([{x:rand(60,210),y:rand(282,300)},{x:rand(420,580),y:rand(282,300)},{x:rand(260,380),y:rand(282,300)},{x:rand(80,560),y:rand(286,300)}]);d.targetX=z.x;d.targetY=z.y;}
      else if(arrived){d.state='leave';d.targetX=d.fromLeft?670:-30;d.targetY=286+rand(-5,5);}
      if(d.kind!=='puppy'&&d.state!=='leave'&&d.y>=276&&d.y<=300&&Math.random()<dt*.018&&dogPoops.length<5){dogPoops.push({x:d.x,y:d.y+8,born:t,cleaning:false});}
      if(d.state==='leave'&&(d.x<-25||d.x>665)){
        if(d.kind==='male'&&dogFamilyStage===1){dogFamilyStage=2;setTimeout(()=>{if(!dogVisitors.some(x=>x.kind==='female')){spawnDog('male',true);spawnDog('female',true);dogVisitors.slice(-2).forEach((x,j)=>{x.x-=j*16;x.timer=rand(8,12);});}},1200);}
        else if(d.kind==='female'&&dogFamilyStage===2){dogFamilyStage=0;puppyDelay=rand(9,18);}d.remove=true;
      }
    });
    dogVisitors=dogVisitors.filter(d=>!d.remove);
  }

  function choosePoopCleanup(a){const p=dogPoops.find(p=>!p.cleaning);if(!p)return false;p.cleaning=true;a.poopTarget=p;a.idle='cleanPoop';a.idleAction='walk';a.targetX=Math.max(48,Math.min(580,p.x+(p.x<a.x?14:-14)));a.targetY=Math.max(276,Math.min(300,p.y));a.state='idleWalk';a.walkPhase=0;return true;}
  function addLog(msg){const d=document.createElement('div'); d.textContent='> '+msg; ui.log.prepend(d);while(ui.log.children.length>8) ui.log.removeChild(ui.log.lastChild);}

    if(a.index===0){px(x-9,y-24,18,5,'#2e4f6b');px(x-3,y-27,10,4,'#2e4f6b');px(x,y-24,3,2,accent);}else if(a.index===1){px(x-8,y-18,3,10,hair);px(x+7,y-18,3,10,hair);px(x-4,y-14,4,3,'#26333d');px(x+2,y-14,4,3,'#26333d');px(x,y-13,2,1,'#26333d');px(x-8,y-24,18,5,'#355b78');px(x-4,y-27,10,4,'#355b78');px(x-1,y-24,3,2,accent);}else{px(x-7,y-19,4,5,hair);px(x+5,y-19,4,5,hair);px(x-8,y-24,18,5,'#254b63');px(x-5,y-27,12,4,'#254b63');px(x-1,y-24,3,2,accent);}
    if(a.state==='inspect'&&a.task){const v=vesselFor(a.task);if(v){const pulse=(Math.floor(t*5+a.index)%3);px(v.x-6+pulse*5,v.y-22,3,3,'#e7cf78');}}if(a.state==='stuck'){px(x+8,y-8,8,10,'#344c5f');px(x+10,y-6,4,4,'#6ea5b5');}if(a.state==='deskSearch'){px(x+8,y-11,8,7,'#263a4d');px(x+10,y-9,4,2,'#65b5d0');}
    if(a.state==='walkBack'&&a.successFlash>0){const passed=a.successFlash>0&&a.lastResult!=='no';const signX=x+10,signY=y-20;if(passed){px(signX,signY,18,10,'#2f7f45');px(signX+2,signY+2,14,6,'#58bd70');txt('OK',signX+9,signY+7,'#ffffff',5,'center');px(x+8,y-7,3,12,P.skin);}else if(a.lastResult==='no'){px(signX,signY,18,10,'#8a3436');px(signX+2,signY+2,14,6,'#d86161');txt('NO',signX+9,signY+7,'#ffffff',5,'center');px(x+8,y-7,3,12,P.skin);}}
    if(a.state==='celebrate')txt('*',x+11,y-25,P.gold,7);
    if(a.state==='idle'){
      if(a.idleAction==='coffee'){const lift=Math.sin(t*3+a.index)>0.2?-5:0;px(x+8,y-4+lift,6,6,'#e8dfcc');px(x+10,y-2+lift,3,2,'#76503c');}
      else if(a.idleAction==='files'){px(x-13,y-2,10,8,P.paper);px(x-11,y,6,2,'#a99b80');px(x-11,y+4,7,2,'#a99b80');}
      else if(a.idleAction==='window'||a.idleAction==='lookSea'){px(x-8,y-6,4,3,'#2e4f6b');px(x+6,y-6,4,3,'#2e4f6b');px(x-4,y-5,10,2,'#2e4f6b');}
      else if(a.idleAction==='plant'){px(x+8,y-3,8,7,'#8c603e');px(x+10,y-7,4,5,'#5c9555');}
      else if(a.idleAction==='waterPlant'){const target=a.plantTarget;const dir=target&&target.x<x?-1:1;px(x+dir*8-(dir<0?10:0),y-2,10,7,'#5f8fa1');px(x+dir*15-(dir<0?5:0),y-5,5,4,'#5f8fa1');px(x+dir*6-(dir<0?3:0),y,3,5,'#345c6b');if(target&&target.alive&&Math.hypot(a.x-target.x,a.y-target.y)<=30){const drop=Math.floor((t*8+a.index*3)%8);const sx=x+dir*20,sy=y-2+drop;const dx=target.x-sx,dy=(target.y+5)-sy,dist=Math.max(1,Math.hypot(dx,dy));px(sx+dx/dist*Math.min(drop*2,dist),sy+dy/dist*Math.min(drop*2,dist),2,2,'#78bdd0');}}
      else if(a.idleAction==='desk'){px(x-7,y+5,14,3,'#3c4d5a');}else if(a.idleAction==='stretch'){const lift=Math.sin(t*2.2+a.index)>0?-6:-2;px(x-11,y-6+lift,4,9,P.skin);px(x+8,y-6+lift,4,9,P.skin);}else if(a.idleAction==='radio'){px(x+9,y-3,9,8,'#3b4650');px(x+11,y-6,2,4,'#3b4650');px(x+11,y-1,4,2,'#8aa0a8');}else if(a.idleAction==='chat'){px(x+8,y-5,4,8,P.skin);px(x+10,y-8,3,3,P.skin);}else if(a.idleAction==='checkCoworker'){px(x+8,y-4,7,9,P.paper);px(x+10,y-2,4,2,'#9a8e73');px(x+10,y+2,4,2,'#9a8e73');}
      else if(a.idleAction==='fishing'){const dir=x<320?1:-1;const rodX=x+dir*8,rodY=y-5;const tipX=x+dir*26,tipY=276;const bobX=x+dir*34,bobY=326;ctx.strokeStyle='#5b3e28';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(rodX,rodY);ctx.lineTo(tipX,tipY);ctx.stroke();ctx.strokeStyle='#e4ddc9';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(tipX,tipY);ctx.lineTo(bobX,bobY);ctx.stroke();px(bobX-2,bobY-1,4,2,'#d85f58');if(a.fishNibble<.55){const fx=bobX+dir*7,fy=bobY+5;px(fx-4,fy,8,4,'#6fa8a8');px(fx+dir*4-(dir<0?4:0),fy-2,4,4,'#6fa8a8');px(fx-dir*2,fy+1,2,2,'#d7e5d7');}}
      else if(a.idleAction==='cleanPoop'){px(x+8,y-6,5,13,'#7d5d3f');px(x+5,y+5,12,4,'#b6aa8f');px(x-9,y+4,8,6,'#4a6f55');px(x-7,y+2,4,3,'#d9d4c2');}
    }
  }
  function bubble(a,s){const x=a.x,y=a.y-40,w=Math.max(28,s.length*5+7);rect(x-w/2,y-9,w,10,'#eee8d7');rect(x-2,y+1,4,3,'#eee8d7');txt(s,x,y-2,'#252522',5,'center');}
  function frame(now){if(!running)return;let dt=Math.min(.05,(now-last)/1000)*speed;last=now;update(dt);drawRoom();agents.slice().sort((a,b)=>a.y-b.y).forEach(drawAgent);requestAnimationFrame(frame);}
  ui.start.addEventListener('click',startBatch);
  ui.add.addEventListener('click',()=>{enqueue(1);addLog('新增一艘待查船');});
  ui.finish.addEventListener('click',()=>{queue=[];agents.forEach(a=>{if(a.task){done++;a.state='walkBack';}});done=Math.min(total,done);if(done<total)done=total;celebrate=2.8;agents.forEach(a=>{a.task=null;a.bay=null;a.x=a.homeX;a.y=a.homeY;a.state='celebrate'});sync();addLog('全部立即標記完成');});
  ui.aiTest.addEventListener('click',testDeepSeek);
  ui.aiSave.addEventListener('click',()=>{const value=normalizeTownAiBase(ui.aiBase?.value||'');if(!value){addLog('請貼你的 Render 服務網址，例如 https://xxxx.onrender.com；也可以直接貼完整 /api/town/think 網址');return;}TOWN_AI_BASE=value;localStorage.setItem('customs-town-ai-base',TOWN_AI_BASE);ui.aiBase.value=TOWN_AI_BASE;addLog('Render AI 網址已保存，下次啟動會自動沿用');});
  ui.reset.addEventListener('click',()=>resetBatch(true));
  ui.speed.addEventListener('change',()=>{speed=Math.max(.4,Math.min(2,Number(ui.speed.value)||1));});
  async function bootWorld(){await loadWorld();if(!plantStates.length)seedPlants();agents.forEach((a,i)=>{a.x=a.homeX+(i-1)*16;a.y=a.homeY-34-i*5;a.decisionTimer=rand(.5,2.0);chooseIdleTarget(a);a.walkPhase=i*1.7;});addLog('CUSTOMS AGENT TOWN 已啟動，生活資料已延續');sync();requestAnimationFrame(frame);}
  window.addEventListener('pagehide',saveWorld);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveWorld();});
  bootWorld();
})();
</script>
</body>
</html>
