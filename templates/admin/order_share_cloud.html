<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORDER 雲端分享管理</title>
<style>
:root{--red:#ff2d4f;--bg:#fff7f8;--line:#f2d9de;--text:#20242a;--muted:#7c8490;--green:#18a874}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,"Microsoft JhengHei",sans-serif;color:var(--text)}
.wrap{max-width:1500px;margin:0 auto;padding:22px}.top{display:flex;justify-content:space-between;gap:16px}.top h1{margin:0 0 6px;font-size:25px}.sub,.who,.muted{color:var(--muted);font-size:12px}.who{text-align:right}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}.stat,.panel,.tools{background:#fff;border:1px solid var(--line);border-radius:14px}.stat{padding:14px 16px}.stat strong{display:block;font-size:24px;margin-top:6px}.tools{display:flex;gap:8px;padding:10px;margin-bottom:12px}.tools input,.tools select,.field input,.field select{height:38px;border:1px solid #dfe3e8;border-radius:9px;padding:0 11px;background:#fff}.tools input{flex:1}
button{height:36px;border:1px solid #dfe3e8;border-radius:9px;background:#fff;padding:0 12px;font-weight:750;cursor:pointer}button.primary{background:var(--red);border-color:var(--red);color:#fff}button.danger{color:var(--red);border-color:#ff9caf}button:disabled{opacity:.45}
.panel{overflow:hidden}.row{display:grid;grid-template-columns:minmax(230px,1.7fr) 90px 135px 150px 130px minmax(330px,1.5fr);gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid #f0e6e8}.row.head{font-size:12px;color:#69717c;background:#fffafb;font-weight:700}.row:last-child{border-bottom:0}.name{font-weight:850}.id{font-size:10px;color:#9aa0a8;margin-top:4px;word-break:break-all}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.badge.active{background:#eaf9f3;color:#087e58}.badge.expired{background:#fff4df;color:#9a5a00}.badge.revoked{background:#fff0f2;color:#c11e3b}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty,.loading{padding:48px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(20,24,32,.32);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.dialog{width:min(920px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 22px 60px rgba(0,0,0,.18)}.dlg-head{display:flex;justify-content:space-between;gap:16px;padding:18px 20px;border-bottom:1px solid var(--line)}.dlg-head h2{margin:0;font-size:20px}.dlg-body{padding:18px 20px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:800;color:#69717c}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}.check{display:flex;align-items:center;gap:8px;border:1px solid #edf0f3;border-radius:9px;padding:10px;font-size:12px}.check input{accent-color:var(--red)}.orders{border:1px solid #edf0f3;border-radius:10px;overflow:hidden}.orders-head{padding:9px 11px;background:#fafbfc;font-size:12px;font-weight:850}.order{display:grid;grid-template-columns:minmax(180px,1fr) 110px 110px;gap:8px;align-items:center;padding:9px 11px;border-top:1px solid #f0f2f5;font-size:12px}.order-main{display:flex;gap:8px;align-items:center}.order-main small{color:#9299a4}.order label{display:flex;align-items:center;gap:5px}.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}.toast{position:fixed;right:22px;bottom:22px;background:#20242a;color:#fff;padding:12px 16px;border-radius:10px;opacity:0;transition:.2s}.toast.show{opacity:1}
@media(max-width:900px){.wrap{padding:12px}.stats{grid-template-columns:repeat(2,1fr)}.tools{flex-wrap:wrap}.tools input{flex-basis:100%}.row.head{display:none}.row{grid-template-columns:1fr 1fr}.row>div:first-child,.row>.actions{grid-column:1/-1}.settings-grid,.checks{grid-template-columns:1fr}.order{grid-template-columns:1fr}.who{display:none}}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><div><h1>ORDER 雲端分享管理</h1><div class="sub">直接管理 Render / TiDB 分享，不需要開啟本機 ORDER。</div></div><div class="who">登入：{{ admin_username }}<br><a href="/admin">返回管理後台</a></div></div>
 <div class="stats"><div class="stat"><small>目前有效</small><strong id="sActive">—</strong></div><div class="stat"><small>永久</small><strong id="sPermanent">—</strong></div><div class="stat"><small>已到期</small><strong id="sExpired">—</strong></div><div class="stat"><small>已失效</small><strong id="sRevoked">—</strong></div></div>
 <div class="tools"><input id="search" placeholder="搜尋客戶名稱 / customer key / 分享編號"><select id="status"><option value="all">全部狀態</option><option value="active">有效</option><option value="expired">已到期</option><option value="revoked">已失效</option></select><button id="refresh">刷新</button></div>
 <div class="panel"><div class="row head"><div>客戶</div><div>狀態</div><div>有效期</div><div>建立時間</div><div>訪問</div><div>操作</div></div><div id="rows" class="loading">正在讀取 Render / TiDB…</div></div>
</div>
<div class="modal" id="settingsModal"><div class="dialog"><div class="dlg-head"><div><h2 id="dlgTitle">分享設定</h2><div class="muted" id="dlgId"></div></div><button data-close>×</button></div><div class="dlg-body" id="dlgBody">讀取中…</div><div class="dlg-foot"><button data-close>取消</button><button class="primary" id="saveSettings">保存分享設定</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id);let shares=[],detail=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(e){if(!e)return '—';return new Date(Number(e)*1000).toLocaleString('zh-TW',{hour12:false})}
function dtVal(e){if(!e)return '';const d=new Date(Number(e)*1000),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function statusLabel(s){return s==='active'?'有效':s==='expired'?'已到期':'已失效'}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function stats(){$('sActive').textContent=shares.filter(x=>x.status==='active').length;$('sPermanent').textContent=shares.filter(x=>x.status==='active'&&x.is_permanent).length;$('sExpired').textContent=shares.filter(x=>x.status==='expired').length;$('sRevoked').textContent=shares.filter(x=>x.status==='revoked').length}
function render(){const q=$('search').value.trim().toLowerCase(),st=$('status').value,list=shares.filter(x=>(st==='all'||x.status===st)&&(!q||[x.customer_name,x.customer_key,x.id].join(' ').toLowerCase().includes(q)));if(!list.length){$('rows').className='empty';$('rows').innerHTML='沒有符合條件的分享';return}$('rows').className='';$('rows').innerHTML=list.map(x=>{const expiry=x.is_permanent?'永久':(x.expires_at_epoch?fmt(x.expires_at_epoch):'—'),edit=x.status!=='revoked';return `<div class="row"><div><div class="name">${esc(x.customer_name||x.customer_key||'—')}</div><div class="id">#${esc(x.id)}</div><div class="muted">${esc(x.source_site||'LEGACY')} · ${esc(x.history_scope||'current')}</div></div><div><span class="badge ${esc(x.status)}">${statusLabel(x.status)}</span></div><div><strong>${esc(expiry)}</strong></div><div>${fmt(x.created_at_epoch)}</div><div><strong>${Number(x.access_count||0)} 次</strong><div class="muted">${x.last_accessed_at_epoch?fmt(x.last_accessed_at_epoch):'尚未訪問'}</div></div><div class="actions"><button data-settings="${esc(x.id)}" ${edit?'':'disabled'}>設定</button><button data-act="24" data-id="${esc(x.id)}" ${edit?'':'disabled'}>+24h</button><button data-act="168" data-id="${esc(x.id)}" ${edit?'':'disabled'}>+7天</button><button data-act="perm" data-id="${esc(x.id)}" ${(!edit||x.is_permanent)?'disabled':''}>永久</button><button class="danger" data-act="revoke" data-id="${esc(x.id)}" ${edit?'':'disabled'}>立即失效</button></div></div>`}).join('')}
async function load(){try{const r=await fetch('/admin/order-shares/api/list',{credentials:'same-origin',cache:'no-store'});if(r.status===401||r.status===403){location.href='/login?next=/admin/order-shares';return}const p=await r.json();if(!r.ok||!p.ok)throw new Error(p.error||'讀取失敗');shares=p.shares||[];stats();render()}catch(e){$('rows').className='empty';$('rows').textContent=e.message||'讀取失敗'}}
async function setExpiry(id,h){const body=h==='perm'?{permanent:true}:{hours:Number(h)},r=await fetch('/admin/order-shares/api/'+encodeURIComponent(id)+'/expiry',{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),p=await r.json();if(!r.ok||!p.ok)throw new Error(p.error||'更新失敗')}
async function revoke(id){const r=await fetch('/admin/order-shares/api/'+encodeURIComponent(id)+'/revoke',{method:'POST',credentials:'same-origin'}),p=await r.json();if(!r.ok||!p.ok)throw new Error(p.error||'失效失敗')}
async function openSettings(id){$('settingsModal').classList.add('show');$('dlgBody').textContent='正在讀取…';const r=await fetch('/admin/order-shares/api/'+encodeURIComponent(id)+'/detail',{credentials:'same-origin',cache:'no-store'}),p=await r.json();if(!r.ok||!p.ok)throw new Error(p.error||'讀取失敗');detail=p.share;$('dlgTitle').textContent=detail.customer_name||detail.customer_key||'分享設定';$('dlgId').textContent='#'+detail.id;const orders=detail.orders||[];$('dlgBody').innerHTML=`<div class="settings-grid"><div class="field"><label>有效期</label><select id="expMode"><option value="permanent" ${detail.is_permanent?'selected':''}>永久</option><option value="24h">24 小時</option><option value="7d">7 天</option><option value="30d">30 天</option><option value="custom" ${!detail.is_permanent?'selected':''}>自訂日期</option></select><input id="expCustom" type="datetime-local" value="${esc(dtVal(detail.expires_at_epoch))}" ${detail.is_permanent?'hidden':''}></div><div class="field"><label>訂單範圍</label><select id="scope"><option value="current" ${detail.history_scope==='current'?'selected':''}>目前</option><option value="6m" ${detail.history_scope==='6m'?'selected':''}>6 個月</option><option value="12m" ${detail.history_scope==='12m'?'selected':''}>12 個月</option><option value="all" ${detail.history_scope==='all'?'selected':''}>全部歷史</option></select></div></div><div class="checks"><label class="check"><input id="showImages" type="checkbox" ${detail.show_images?'checked':''}>業務圖片</label><label class="check"><input id="showWf" type="checkbox" ${detail.show_workflow_images?'checked':''}>工廠 / 流程圖片</label><label class="check"><input id="showPdf" type="checkbox" ${detail.show_pdf_pages?'checked':''}>PDF 拆圖</label><label class="check"><input id="allowPdf" type="checkbox" ${detail.allow_report_pdf_download?'checked':''}>PDF 報告下載</label></div><div class="orders"><div class="orders-head">訂單權限 · ${orders.length} 筆</div>${orders.map(o=>`<div class="order" data-order="${esc(o.order_number)}"><div class="order-main"><input data-show type="checkbox" ${o.show_order!==false?'checked':''}><strong>${esc(o.order_number)}</strong><small>${esc(o.product_name||o.production_type||'')}</small></div><label><input data-img type="checkbox" ${o.show_images!==false?'checked':''} ${o.show_order===false?'disabled':''}>業務圖</label><label><input data-wf type="checkbox" ${o.show_workflow_images!==false?'checked':''} ${o.show_order===false?'disabled':''}>流程圖</label></div>`).join('')}</div><p class="muted">取消顯示不會刪除 TiDB/B2 資料，只改這條分享的可見權限。</p>`}
async function saveSettings(){if(!detail)return;const m=$('expMode').value,body={history_scope:$('scope').value,show_images:$('showImages').checked,show_workflow_images:$('showWf').checked,show_pdf_pages:$('showPdf').checked,allow_report_pdf_download:$('allowPdf').checked};if(m==='permanent')body.is_permanent=true;else if(m==='24h')body.duration_minutes=1440;else if(m==='7d')body.duration_minutes=10080;else if(m==='30d')body.duration_minutes=43200;else{const d=new Date($('expCustom').value);if(!Number.isFinite(d.getTime())||d.getTime()<=Date.now())throw new Error('請選擇未來日期');body.is_permanent=false;body.expires_at_epoch=Math.floor(d.getTime()/1000)}body.order_visibility=[...document.querySelectorAll('[data-order]')].map(r=>({order_number:r.dataset.order,show_order:r.querySelector('[data-show]').checked,show_images:r.querySelector('[data-img]').checked,show_workflow_images:r.querySelector('[data-wf]').checked}));const r=await fetch('/admin/order-shares/api/'+encodeURIComponent(detail.id)+'/settings',{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),p=await r.json();if(!r.ok||!p.ok)throw new Error(p.error||'保存失敗');toast('分享設定已保存');$('settingsModal').classList.remove('show');await load()}
document.addEventListener('change',e=>{if(e.target.id==='expMode')$('expCustom').hidden=e.target.value!=='custom';if(e.target.matches('[data-show]')){const r=e.target.closest('[data-order]');r.querySelectorAll('[data-img],[data-wf]').forEach(x=>{x.disabled=!e.target.checked;if(!e.target.checked)x.checked=false})}})
document.addEventListener('click',async e=>{const st=e.target.closest('[data-settings]');if(st){try{await openSettings(st.dataset.settings)}catch(err){alert(err.message);$('settingsModal').classList.remove('show')}return}if(e.target.closest('[data-close]')){$('settingsModal').classList.remove('show');return}const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;if(a==='revoke'&&!confirm('確定讓這條分享立即失效？'))return;b.disabled=true;try{if(a==='revoke')await revoke(id);else await setExpiry(id,a);toast(a==='revoke'?'分享已失效':'有效期已更新');await load()}catch(err){alert(err.message||'操作失敗');b.disabled=false}})
$('saveSettings').onclick=()=>saveSettings().catch(e=>alert(e.message||'保存失敗'));$('search').addEventListener('input',render);$('status').addEventListener('change',render);$('refresh').onclick=load;
load();setInterval(load,30000);
</script>
</body></html>
