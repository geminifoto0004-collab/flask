<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>客戶分享</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--card:#fff;--ink:#20242a;--mute:#707780;--line:#e4e7eb;--red:#ee3b4f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Microsoft JhengHei",sans-serif}.wrap{max-width:840px;margin:auto;padding:20px max(14px,env(safe-area-inset-right)) 24px max(14px,env(safe-area-inset-left))}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}h1{font-size:22px;margin:0}.back{font-size:13px;color:var(--mute)}.sub{font-size:13px;color:var(--mute);margin:6px 0 14px}.tools{display:flex;gap:8px;position:sticky;top:0;background:var(--bg);padding:6px 0 12px}.tools input{flex:1;min-width:0;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}button,.open{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;text-decoration:none}.open{background:var(--red);border-color:var(--red);color:#fff}.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}.count{font-size:13px;color:var(--mute);margin:0 0 10px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;margin-bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:14px}.customer{min-width:0}.name{font-weight:700;font-size:16px;overflow-wrap:anywhere}.expiry{color:var(--mute);font-size:12px;margin-top:5px}.actions{display:flex;flex:none;gap:8px}.empty{padding:28px 10px;text-align:center;color:var(--mute)}.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#242830;color:#fff;border-radius:10px;padding:10px 16px;max-width:90vw}.toast[hidden]{display:none}@media(max-width:480px){.wrap{padding-top:14px}.row{flex-wrap:wrap;gap:10px}.customer{flex:1 1 150px}.actions{margin-left:auto}button,.open{padding:0 12px}}@media(prefers-color-scheme:dark){:root{--bg:#15171b;--card:#21242a;--ink:#edf0f4;--mute:#a6adb8;--line:#373b43}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><h1>客戶分享</h1><a class="back" href="/admin">管理後台</a></div>
<p class="sub">只顯示目前有效的分享</p>
<div class="tools"><input id="search" type="text" placeholder="搜尋客戶名稱" aria-label="搜尋客戶名稱" autocomplete="off"><button id="refresh" type="button">重新整理</button></div>
<p id="count" class="count" aria-live="polite"></p>
<div id="rows" aria-live="polite"><div class="empty">正在讀取客戶…</div></div>
</main><div id="toast" class="toast" role="status" hidden></div>
<script>
const $=id=>document.getElementById(id);let shares=[],loading=false,toastTimer;
const copyIcon='<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>';
const openIcon='<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7M21 3 11 13M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg>';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function active(x){return x.status==='active'&&(!x.expires_at_epoch||Number(x.expires_at_epoch)>Date.now()/1000)}
function safeUrl(v){try{const u=new URL(v,location.origin);return u.origin===location.origin&&u.pathname.startsWith('/share/')?u.href:''}catch{return ''}}
function toast(msg){clearTimeout(toastTimer);$('toast').textContent=msg;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,2400)}
function render(){const q=$('search').value.trim().toLocaleLowerCase(),list=shares.filter(x=>active(x)&&(!q||[x.customer_name,x.customer_key].join(' ').toLocaleLowerCase().includes(q)));$('count').textContent=q?`${list.length} 筆符合搜尋`:`${list.length} 筆有效分享`;$('rows').innerHTML=list.length?list.map(x=>{const url=safeUrl(x.share_url),expiry=x.is_permanent?'永久有效':`有效至 ${new Date(Number(x.expires_at_epoch)*1000).toLocaleDateString('zh-TW')}`;return `<div class="row"><div class="customer"><div class="name">${esc(x.customer_name||x.customer_key||'—')}</div><div class="expiry">${esc(expiry)}</div></div><div class="actions"><button type="button" data-copy="${esc(x.id)}" ${url?'':'disabled'}>${copyIcon}複製連結</button>${url?`<a class="open" href="${esc(url)}" target="_blank" rel="noopener">${openIcon}開啟</a>`:''}</div></div>`}).join(''):'<div class="empty">沒有符合條件的有效分享</div>'}
async function load(){if(loading)return;loading=true;$('refresh').disabled=true;try{const r=await fetch('/admin/order-shares/api/list?status=active',{credentials:'same-origin',cache:'no-store'});if(r.status===401||r.status===403){location.href='/login?next=/admin/order-shares';return}const p=await r.json();if(!r.ok||!p.ok)throw new Error(p.error||'讀取失敗');shares=p.shares||[];render()}catch(e){$('count').textContent='';$('rows').innerHTML='<div class="empty">'+esc(e.message||'讀取失敗')+'，請按重新整理重試。</div>'}finally{loading=false;$('refresh').disabled=false}}
async function copy(url){if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(url);return}const el=document.createElement('textarea');el.value=url;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.select();el.setSelectionRange(0,el.value.length);try{if(!document.execCommand('copy'))throw Error('copy failed')}finally{el.remove()}}
$('rows').addEventListener('click',async e=>{const b=e.target.closest('[data-copy]');if(!b)return;const x=shares.find(x=>x.id===b.dataset.copy),url=x&&active(x)&&safeUrl(x.share_url);if(!url){render();toast('這筆分享已到期');return}try{await copy(url);toast('連結已複製')}catch{toast('複製失敗，請重試')}});
$('search').addEventListener('input',render);$('refresh').onclick=load;window.addEventListener('pageshow',e=>{if(e.persisted)load()});load();
</script>
</body></html>
